<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="735" viewBox="0 0 1824 735" role="img" aria-labelledby="title desc"><title id="title">Load step 2 · completed image, appended PCB, preliminary stack</title><desc id="desc">After transfer, create_process allocates PCB 2 in the Kernel Heap and initializes state to NEW. The previous tail PCB 1 receives next = PCB 2 and process_list_tail changes to PCB 2. The new PCB points to a fresh standard descriptor table and its Process Payload. create_process writes cs minus one into the cell at highest_stack_address. The argument and environment layout does not exist yet.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><g transform="translate(0,-125)"><rect x="32" y="250" width="70" height="170" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="67.0" y="340.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.ivt</text><rect x="102" y="250" width="110" height="170" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="157.0" y="340.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.text</text><rect x="212" y="250" width="260" height="170" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="342.0" y="308.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.data · kernel globals</text><text 