<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="440" viewBox="0 0 1800 440" role="img" aria-labelledby="title desc"><title id="title">Init reads configuration, then starts the shell</title><desc id="desc">Init starts with an empty environ array. Its read_environment function opens config/environment.txt and reads PATH=/user, then setenv stores an independent string in init&#x27;s User Process Heap. With loading_bar_enabled true, init also stores PICOOS_LOADING_BAR=true. Init calls run(shell_pid, NULL, NULL), selecting its own environ. The shell receives independent stack and heap copies. Leftward arrows are read requests, rightward arrows return file contents or copy environment data. The file performs no operation itself.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1800" height="440" fill="white"/><g font-family="Cantarell, sans-serif"><g transform="translate(0,-40)"><rect x="32" y="145" width="300" height="180" fill="#f4f8f8" stroke="#637983" stroke-width="2"/><text x="182" y="183" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">Configuration file</text><a href="../../config/environment.txt"><text x="182" y="223" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">config/environment.txt</text></a><text x="182" y="270" text-anchor="middle" font-size="25" font-weight="normal" fill="#17313a">PATH=/user</text><rect x="660" y="60" width="500" height="400" fill="white" stroke="#637983" stroke-width="2"/><a href="../../system/init.picoc#L100"><text x="910.0" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#17313a">init process</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="910" y="129" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">Starts with an empty environ array</text></a><rect x="680" y="148" width="460" height="99" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../system/init.picoc#L19"><text x="910" y="178" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">read_environment()</text></a><text x="910" y="208" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">Parses NAME=value entries</text><a href="../../library/stdlib/env.picoc#L126"><text x="910" y="237" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">setenv(&quot;PATH&quot;, &quot;/user&quot;, true)</text></a><path d="M 680 192 L 332 192" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../library/fcntl/fcntl.picoc#L5"><text x="506" y="154" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">open(path, O_RDONLY)</text></a><a href="../../library/unistd/io.picoc#L6"><text x="506" y="180" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">read(fd, contents, 256)</text></a><path d="M 332 236 L 680 236" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="506" y="223" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">returns contents: PATH=/user</text><a href="../../config/config.header#L5"><text x="910" y="277" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">if (loading_bar_enabled)</text></a><a href="../../library/stdlib/env.picoc#L126"><text x="910" y="302" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">setenv(&quot;PICOOS_LOADING_BAR&quot;, &quot;true&quot;, true)</text></a><path d="M 910 309 L 910 325" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><rect x="680" y="325" width="460" height="135" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../library/stdlib/env.picoc#L4"><text x="910.0" y="353" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">.data: environ</text></a><path d="M 910.0 362 L 910.0 380" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="910.0" y="404" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">&quot;PATH=/user&quot;</text><a href="../../common/loading_bar.header#L5"><text x="910.0" y="433" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">&quot;PICOOS_LOADING_BAR=true&quot;</text></a><text x="910.0" y="454" text-anchor="middle" font-size="17" font-weight="normal" fill="#17313a">Heap: pointer array + strings + NULL</text><rect x="1460" y="60" width="308" height="400" fill="white" stroke="#637983" stroke-width="2"/><a href="../../user/shell.picoc"><text x="1614.0" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#17313a">shell process</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="1614" y="175" text-anchor="middle" font-size="23" font-weight="normal" fill="#17313a">Own environ array</text></a><text x="1614" y="208" text-anchor="middle" font-size="23" font-weight="normal" fill="#17313a">and string copies</text><text x="1614" y="246" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">Same values as init</text><rect x="1480" y="325" width="268" height="135" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../library/stdlib/env.picoc#L4"><text x="1614" y="355" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">.data: environ</text></a><path d="M 1614 366 L 1614 390" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="1614" y="421" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">User Process Heap</text><text x="1614" y="447" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">Array + strings</text><text x="1310" y="279" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">init calls</text><a href="../../library/unistd/process.picoc#L31"><text x="1310" y="308" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">run(shell_pid, NULL, NULL)</text></a><text x="1310" y="345" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">copies init&#x27;s values</text><path d="M 1140 400 L 1480 400" fill="none" stroke="#167b84" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#405ea8)"/><text x="1310" y="433" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">via shell stack → heap</text></g></g></svg>
