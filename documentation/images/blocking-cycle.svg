<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Sleep, wakeup, resume: the waiting cycle</title>
<desc id="desc">A clockwise cycle shows one process's PCB state. BLOCKED: waiting for an event on a wait queue after sleep(). An event triggers wakeup(), removing the waiter and making its state READY: waiting for CPU time. The scheduler selects it and the dispatcher resumes it with state RUNNING. If it needs another event, sleep() joins the wait queue again. Kernel events use the corresponding queue helpers directly. The central message is READY does not mean RUNNING.</desc>
