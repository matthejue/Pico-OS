<a href="../../kernel/process/process.header#L14"><text x="800" y="686" text-anchor="middle" font-size="38" font-weight="bold" fill="#25734f">RUNNING</text></a>
<text x="800" y="734" text-anchor="middle" font-size="26" font-weight="normal" fill="#17313a">Executing on the CPU</text>
