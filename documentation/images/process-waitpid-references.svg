<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="236" viewBox="0 0 1300 236" role="img" aria-labelledby="title desc"><title id="title">Waitpid request and PCB reference the same stack-local status</title><desc id="desc">The parent process&#x27;s User Process Stack contains a waitpid frame with a WaitPidRequest request and a separate int status. request.status and PCB 1&#x27;s waiting_status_ptr both point to that integer. The parent PCB is a separate Kernel Heap allocation. The request remains on the user stack while the kernel retains only the result address for wakeup.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1300" height="236" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="32" y="24" width="720" height="188" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../library/sys/wait/wait.picoc#L14"><text x="392" y="62" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">waitpid() frame · User Process Stack</text></a><rect x="52" y="94" width="310" height="96" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../common/syscall.header#L61"><text x="207" y="124" text-anchor="middle" font-size="22" font-weight="bold" fill="#43576a">WaitPidRequest request</text></a><a href="../../common/syscall.header#L62"><text x="207" y="152" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">pid</text></a><a href="../../common/syscall.header#L63"><text x="207" y="178" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">status</text></a><rect x="552" y="94" width="180" height="96" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L15"><text x="642" y="137" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">int status</text></a><text x="642" y="171" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">result value</text><rect x="1012" y="24" width="256" height="188" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../kernel/process/process.header#L31"><text x="1140" y="62" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">PCB 1 · parent</text></a><text x="1140" y="92" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">Kernel Heap</text><rect x="1032" y="132" width="216" height="58" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../kernel/process/process.header#L44"><text x="1140" y="168" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">waiting_status_ptr</text></a><path d="M 362 166 H 552" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><path d="M 1032 166 H 732" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/></g></svg>
