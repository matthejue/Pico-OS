<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="324" viewBox="0 0 1300 324" role="img" aria-labelledby="title desc"><title id="title">Waitpid request and PCB reference the same stack-local status</title><desc id="desc">The parent process&#x27;s User Process Stack contains a waitpid frame with a two-cell WaitPidRequest request and a separate one-cell int status. The request cells contain an integer pid and the address of status. The separate status cell contains the integer result. request.status and PCB 1&#x27;s waiting_status_ptr both point to that integer. The parent PCB is a separate Kernel Heap allocation. The request remains on the user stack while the kernel retains only the result address for wakeup.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1300" height="324" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="32" y="24" width="790" height="276" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../library/sys/wait/wait.picoc#L14"><text x="427" y="62" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">waitpid() locals · User Process Stack</text></a><text x="427" y="88" text-anchor="middle" font-size="16" font-weight="normal" fill="#43576a">Lower addresses → higher addresses</text><rect x="52" y="154" width="250" height="104" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../common/syscall.header#L62"><text x="177" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">int request.pid</text></a><text x="177" y="215" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">2</text><text x="177" y="243" text-anchor="middle" font-size="18" font-weight="normal" fill="#43576a">integer value</text><rect x="302" y="154" width="250" height="104" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../common/syscall.header#L63"><text x="427" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">int *request.status</text></a><text x="427" y="215" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&amp;status</text><text x="427" y="243" text-anchor="middle" font-size="18" font-weight="normal" fill="#43576a">address</text><rect x="552" y="154" width="250" height="104" fill="#f6eee5" stroke="#43576a" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L15"><text x="677" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">int status</text></a><text x="677" y="215" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">0 → child status</text><text x="677" y="243" text-anchor="middle" font-size="18" font-weight="normal" fill="#43576a">integer value</text><rect x="52" y="258" width="500" height="30" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../common/syscall.header#L61"><text x="302" y="279" text-anchor="middle" font-size="20" font-weight="bold" fill="#43576a">WaitPidRequest request · 2 cells</text></a><rect x="552" y="258" width="250" height="30" fill="#f6eee5" stroke="#43576a" stroke-width="1"/><text x="677" y="279" text-anchor="middle" font-size="20" font-weight="bold" fill="#43576a">Separate int · 1 cell</text><rect x="932" y="24" width="336" height="276" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../kernel/process/process.header#L31"><text x="1100" y="62" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">PCB 1 · parent</text></a><text x="1100" y="92" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">Kernel Heap</text><rect x="952" y="154" width="296" height="104" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../kernel/process/process.header#L44"><text x="1100" y="184" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">int *waiting_status_ptr</text></a><text x="1100" y="215" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&amp;status</text><text x="1100" y="243" text-anchor="middle" font-size="18" font-weight="normal" fill="#43576a">address</text><path d="M 427 154 C 427 100, 677 100, 677 154" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><path d="M 952 206 H 802" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/></g></svg>
