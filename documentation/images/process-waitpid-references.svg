<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="632" viewBox="0 0 1640 632" role="img" aria-labelledby="title desc"><title id="title">Waitpid request and PCB reference the same stack-local status</title><desc id="desc">SRAM runs from lower addresses on the left to higher addresses on the right: Kernel Image, Kernel Heap, Kernel Stack, and Process and Shared Data Heap. Process Payload A contains the parent&#x27;s User Process Image, User Process Heap, and User Process Stack. Dashed guides expand the Kernel Heap on the left and User Process Stack on the right. PCB 1 occupies a Kernel Heap payload after Block Header A. The parent process&#x27;s User Process Stack contains a waitpid frame with a two-cell WaitPidRequest request and a separate one-cell int status. The request cells contain an integer pid and the address of status. The separate status cell contains the integer result. request.status and PCB 1&#x27;s waiting_status_ptr both point to that integer. The parent PCB is a separate Kernel Heap allocation. The request remains on the user stack while the kernel retains only the result address for wakeup. Other allocations, PCB fields, and stack cells are omitted. Widths and local placement are illustrative.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1640" height="632" fill="white"/><g font-family="Cantarell, sans-serif"><text x=