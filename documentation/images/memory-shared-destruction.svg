<a href="../../kernel/shared_memory.picoc#L179"><path d="M 1945.0 295 L 2050 362.5 L 1945.0 430 L 1840 362.5 Z" fill="#fff0cc" stroke="#43576a" stroke-width="1.5"/><text x="1945.0" y="356.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">attachment</text><text x="1945.0" y="379.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">!= NULL?</text></a>
<a href="../../kernel/process/process.picoc#L241"><rect x="2200" y="312.5" width="310" height="100" fill="#e5f3de" stroke="#43576a" stroke-width="1.5"/><text x="2355.0" y="345.0" text-anchor="middle" font-size="15.904139433551196" font-weight="bold" fill="#172b3a">Attachment release complete</text><text x="2355.0" y="368.0" text-anchor="middle" font-size="14.717741935483872" font-weight="normal" fill="#172b3a">remove_process continues cleanup</text><text x="2355.0" y="391.0" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">and frees the PCB</text></a>
<a href="../../kernel/shared_memory.picoc#L180"><rect x="1790" y="540" width="490" height="150" fill="#deecff" stroke="#43576a" stroke-width="1.5"/><text x="2035.0" y="574.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">Release one attachment</text><text x="2035.0" y="597.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">next = attachment-&gt;next</text><text x="2035.0" y="620.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">entry = attachment-&gt;entry</text><text x="2035.0" y="643.5" text-anchor="middle" font-size="14.927261227071472" font-weight="normal" fill="#172b3a">entry-&gt;reference_count = entry-&gt;reference_count - 1</text><text x="2035.0" y="666.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">kfree(attachment)</text></a>
