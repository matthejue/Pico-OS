<svg xmlns="http://www.w3.org/2000/svg" width="1756" height="738" viewBox="0 0 1756 738" role="img" aria-labelledby="title desc">
<title id="title">Shared-memory lifetime: open, map, unlink, release</title>
<desc id="desc">Five snapshots of one shared-memory entry. shm_open creates Entry 1 and Shared Data Payload A with reference_count zero and unlink_requested false. mmap in the processes represented by PCB 1 and PCB 2 creates one attachment each, bringing reference_count to two. Both receive the same address. shm_unlink frees the name, sets name to NULL and unlink_requested to true, but leaves both attachments and the shared data alive. Final removal of PCB 1 releases its attachment and reduces reference_count to one. Final removal of PCB 2 reduces the count to zero, removes Entry 1 from the registry and frees the shared data and entry. Each PCB&#x27;s shared_memory_attachments list owns its attachment, whose entry pointer reaches Entry 1. Horizontal arrows show time. Vertical arrows show entry and address pointers. This example tracks Entry 1 only, without additional mappings after unlink. Cleanup requires both unlink_requested true and reference_count zero, regardless of their order.</desc>
