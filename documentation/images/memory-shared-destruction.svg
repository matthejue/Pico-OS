<svg xmlns="http://www.w3.org/2000/svg" width="2610" height="1380" viewBox="0 0 2610 1380" role="img" aria-labelledby="title desc"><title id="title">Shared-memory deferred destruction decisions</title><desc id="desc">Unlink frees the name and sets unlink_requested. Termination retains attachments while a PCB is a zombie, unless no parent exists or the parent has already collected its status. Final PCB removal releases all attachments, following saved next pointers and decrementing reference_count once per attachment. Only unlink_requested with reference_count zero destroys the shared entry. Destruction updates shared_memory_list_head or the predecessor next pointer, frees the Shared Data Payload with PSDFree, and frees the entry with kfree. The diagram applies to existing registry entries and valid process cleanup. The attachment-release-loop decision indicates caller context, not a PicoOS variable. The bridge separates independent arrow crossings.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker></defs><rect width="2610" height="1380" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="30" text-anchor="start" font-size="23" font-weight="bold" fill="#172b3a">When PicoOS finally frees a Shared Data Payload</text>
<text x="32" y="55" text-anchor="start" font-size="16" font-weight="normal" fill="#172b3a">Existing entry · unlink removes its name · PCB removal releases its attachments</text>
<a href="../../kernel/shared_memory.picoc#L151"><rect x="32" y="85" width="330" height="110" fill="#deecff" stroke="#43576a" stroke-width="1.5"/><text x="197.0" y="134.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">unlink_shared_memory(name)</text><text x="197.0" y="157.0" text-anchor="middle" font-size="12.580645161290322" font-weight="normal" fill="#172b3a">entry = find_shared_memory_by_name(name)</text></a>
<a href="../../kernel/shared_memory.picoc#L163"><rect x="490" y="85" width="450" height="110" fill="#deecff" stroke="#43576a" stroke-width="1.5"/><text x="715.0" y="111.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">Remove the lookup name immediately</text><text x="715.0" y="134.0" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">kfree(entry-&gt;name)</text><text x="715.0" y="157.0" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">entry-&gt;name = NULL</text><text x="715.0" y="180.0" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">entry-&gt;unlink_requested = true</text></a>
<a href="../../kernel/process/process.picoc#L304"><rect x="32" y="280" width="420" height="165" fill="#deecff" stroke="#43576a" stroke-width="1.5"/><text x="242.0" y="310.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">terminate_process(process, status)</text><text x="242.0" y="333.5" text-anchor="middle" font-size="15.814319433516918" font-weight="normal" fill="#172b3a">Reached from exit_process or kill_process</text><text x="242.0" y="356.5" text-anchor="middle" font-size="13.232389730085583" font-weight="normal" fill="#172b3a">parent = find_process_by_pid(process-&gt;parent_pid)</text><text x="242.0" y="379.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">parent_is_waiting = parent != NULL &amp;&amp;</text><text x="242.0" y="402.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">process_has_waiting_parent(process)</text><text x="242.0" y="425.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">process-&gt;state = PROCESS_STATE_ZOMBIE</text></a>
<a href="../../kernel/process/process.picoc#L322"><path d="M 645.0 295 L 770 362.5 L 645.0 430 L 520 362.5 Z" fill="#fff0cc" stroke="#43576a" stroke-width="1.5"/><text x="645.0" y="356.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">parent == NULL</text><text x="645.0" y="379.5" text-anchor="middle" font-size="13.440860215053764" font-weight="normal" fill="#172b3a">|| parent_is_waiting?</text></a>
<a href="../../kernel/process/process.picoc#L321"><rect x="510" y="505" width="270" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1.5"/><text x="645.0" y="549.0" text-anchor="middle" font-size="14.253393665158372" font-weight="bold" fill="#172b3a">Retain PCB and attachments</text><text x="645.0" y="572.0" text-anchor="middle" font-size="13.111342351716962" font-weight="normal" fill="#172b3a">Reference counts stay unchanged</text></a>
<a href="../../kernel/process/process.picoc#L348"><rect x="900" y="490" width="360" height="145" fill="#f0f3f6" stroke="#43576a" stroke-width="1.5"/><text x="1080.0" y="533.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b3a">Later removal of retained PCB</text><text x="1080.0" y="556.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">wait_for_process_by_pid(...)</text><text x="1080.0" y="579.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">orphan_and_signal_children(parent)</text><text x="1080.0" y="602.5" text-anchor="middle" font-size="16" font-weight="normal" fill="#172b3a">unload_process_by_pid(pid)</text></a>
