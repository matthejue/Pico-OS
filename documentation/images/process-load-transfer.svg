<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="725" viewBox="0 0 1824 725" role="img" aria-labelledby="title desc"><title id="title">Load step 1 · receive the linked image before creating its PCB</title><desc id="desc">EPROM, the mapped peripherals and SRAM appear in address order. The host responds through UART RX. CPU polling or optional DMA copies only binary payload words into the allocated User Process Image. A temporary ProcessLoad in the Kernel Heap is referenced by the caller PCB&#x27;s pending_load field. No child PCB exists yet.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1824" height="725" fill="white"/><g font-family="DejaVu Sans, sans-serif"><g transform="translate(0,-55)"><rect x="32" y="175" width="140" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="102.0" y="209.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">EPROM</text><text x="102.0" y="230.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">0x00000000</text><text x="102.0" y="251.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">bootloader</text><rect x="172" y="175" width="220" height="100" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../../RETI-Emulator/include/uart.h"><text x="282.0" y="209.0" text-anchor="middle" font-size="15" font-weight="b