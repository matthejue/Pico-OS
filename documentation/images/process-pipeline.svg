<svg xmlns="http://www.w3.org/2000/svg" width="1612" height="794" viewBox="0 0 1612 794" role="img" aria-labelledby="title desc"><title id="title">Producer stage</title><desc id="desc">LEFT | RIGHT &gt; OUT is executed sequentially using a temporary host file. Four columns read left to right. The rows always mean shell PCB 1, producer PCB 2 for LEFT, consumer PCB 3 for RIGHT, and temporary host file TMP. Descriptor cells show FileDescriptorTable.entries reached through ProcessControlBlock.file_descriptors. Terminal abbreviates /device/terminal.dev. Saved shell slots 5 and 6 are not inherited. Gray dashed arrows show run copying descriptor entries 0–2. Amber outlines mark changed standard paths. Child rows are blank before run, with no process boxes or placeholders. A child&#x27;s first table appears when run copies the shell descriptors. Reaped processes keep their rows without descriptor cells. Each waitpid column shows the result after the child exits and is reaped. The consumer has not been created. The shell redirects stdout to TMP, starts the producer, restores terminal output, then waits for the producer to exit. TMP then contains the complete producer output.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><text x="32" y="146" text-anchor="start" font-size="25" font-weight="bold" fill="#17313a">Shell</text><a href