<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="740" viewBox="0 0 1840 740" role="img" aria-labelledby="title desc"><title id="title">Sequential file-backed pipeline</title><desc id="desc">LEFT | RIGHT &gt; OUT becomes LEFT &gt; TMP followed by RIGHT &lt; TMP &gt; OUT. TMP is .picoos-pipe-&lt;shell PID&gt;.tmp. Read the producer row left to right, then the consumer row left to right. Each row shows shell redirection, run copying the child descriptors, immediate shell restoration, and waitpid. The producer wait completes before the consumer starts. All eight descriptor slots are accounted for in each snapshot. T-in, T-out and T-err are the original terminal endpoints. The shell saves stdin in slot 5 and stdout in slot 6. Neither saved slot is inherited by the child. The consumer setup applies stdout redirection before stdin redirection. TMP holds the complete producer output during the consumer stage and is unlinked after the consumer wait. The snapshots show each process&#x27;s PCB file_descriptors table entries, not memory allocation order.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1840" height="740" fill="white"/><g font-family="Cantarell, sans-serif"><a href="../../user/shell.picoc#L32"><text x="32" y="40" text-anchor="start" font-size="24" font-weight="bold" fill="#17313a">Producer · LEFT &gt; TMP</text></a><a href="../../user/shell.picoc#L33"><text x="32" y="410" text-anchor="start" font-size="24" font-weight="bold" fill="#17313a">Consumer · RIGHT &lt; TMP &gt; OUT</text></a><rect x="32" y="60" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../user/shell.picoc#L1008"><text x="236.0" y="94" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">1  Redirect stdout</text></a><a href="../../library/fcntl/fcntl.picoc#L5"><text x="236.0" y="134" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">open(TMP) → 3</text></a><a href="../../library/unistd/io.picoc#L58"><text x="236.0" y="169" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">dup2(1, 6)</text></a><a href="../../library/unistd/io.picoc#L58"><text x="236.0" y="204" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">dup2(3, 1)</text></a><a href="../../library/unistd/io.picoc#L54"><text x="236.0" y="239" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">close(3)</text></a><rect x="32" y="254" width="408" height="92" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L42"><text x="236.0" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">shell descriptors</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="236.0" y="307" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">0 T-in · 1 TMP · 2 T-err</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="236.0" y="334" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">3–5 free · 6 T-out · 7 free</text></a><rect x="488" y="60" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="692.0" y="94" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">2  Start producer</text></a><a href="../../library/unistd/process.picoc#L31"><text x="692.0" y="146" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">run() copies descriptors 0–2</text></a><a href="../../kernel/filesystem/file_descriptor.picoc#L99"><text x="692.0" y="190" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">Saved slot 6 stays in the shell</text></a><rect x="488" y="254" width="408" height="92" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L42"><text x="692.0" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">producer descriptors</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="692.0" y="307" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">0 T-in · 1 TMP · 2 T-err</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="692.0" y="334" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">3–7 free</text></a><rect x="944" y="60" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../user/shell.picoc#L971"><text x="1148.0" y="94" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">3  Restore shell</text></a><a href="../../library/unistd/io.picoc#L58"><text x="1148.0" y="146" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">dup2(6, 1)</text></a><a href="../../library/unistd/io.picoc#L54"><text x="1148.0" y="190" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">close(6)</text></a><rect x="944" y="254" width="408" height="92" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L42"><text x="1148.0" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">shell descriptors</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="1148.0" y="307" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">0 T-in · 1 T-out · 2 T-err</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="1148.0" y="334" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">3–7 free</text></a><rect x="1400" y="60" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L15"><text x="1604.0" y="94" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">4  Wait for producer</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="1604.0" y="155" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">waitpid(producer)</text></a><text x="1604.0" y="210" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">Producer has finished</text><rect x="1400" y="254" width="408" height="92" fill="#d8efef" stroke="#805916" stroke-width="2"/><a href="../../user/shell.picoc#L34"><text x="1604.0" y="290" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">TMP</text></a><text x="1604.0" y="326" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">Complete producer output</text><path d="M 1604 346 V 375 H 16 V 573 H 32" fill="none" stroke="#805916" stroke-width="2.5" marker-end="url(#9c3d15)"/><a href="../../user/shell.picoc#L803"><text x="920" y="369" text-anchor="middle" font-size="21" font-weight="bold" fill="#805916">Producer finishes before consumer starts</text></a><rect x="32" y="430" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../user/shell.picoc#L1039"><text x="236.0" y="464" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">5  Redirect stdout and stdin</text></a><text x="136.0" y="497" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">stdout first</text><a href="../../library/fcntl/fcntl.picoc#L5"><text x="136.0" y="524" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">open(OUT) → 3</text></a><a href="../../library/unistd/io.picoc#L58"><text x="136.0" y="552" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">dup2(1, 6)</text></a><a href="../../library/unistd/io.picoc#L58"><text x="136.0" y="580" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">dup2(3, 1)</text></a><a href="../../library/unistd/io.picoc#L54"><text x="136.0" y="608" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">close(3)</text></a><text x="336.0" y="497" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">stdin next</text><a href="../../library/unistd/io.picoc#L58"><text x="336.0" y="524" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">dup2(0, 5)</text></a><a href="../../library/unistd/io.picoc#L54"><text x="336.0" y="552" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">close(0)</text></a><a href="../../library/fcntl/fcntl.picoc#L5"><text x="336.0" y="580" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">open(TMP) → 0</text></a><rect x="32" y="624" width="408" height="92" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L42"><text x="236.0" y="648" text-anchor="middle" font-size="19" font-weight="bold" fill="#17313a">shell descriptors</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="236.0" y="677" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">0 TMP · 1 OUT · 2 T-err</text></a><a href="../../kernel/filesystem/file_descriptor.header#L23"><text x="236.0" y="704" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">3–4 free · 5 T-in · 6 T-out · 7 free</text></a><rect x="488" y="430" width="408" height="286" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="692.0" y="464" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">6  Start consumer</text>