#405ea8)"/><a href="../../library/unistd/process.picoc#L31"><text x="750.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">2. run(producer)</text></a><path d="M 905 38 H 935" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../user/shell.picoc#L971"><text x="1090.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">3. Restore shell</text></a><path d="M 1245 38 H 1275" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../library/sys/wait/wait.picoc#L15"><text x="1430.0" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">4. Wait for producer</text></a><a href="../../user/shell.picoc#L1039"><text x="410.0" y="78" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">stdout → TMP</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="1430.0" y="78" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waitpid(producer)</text></a><rect x="260" y="108" width="300" height="150" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/filesystem/file_descriptor.header#L15"><text x="274" y="136" text-anchor="start" font-size="20" font-weight="bold" fill="#17313a">0 · stdin</text></a><a href="../../kernel/filesystem/file_descriptor.header#L19"><text x="546" y="136" text-anchor="end" font-size="20" font-weight="bold" fill="#17313a">terminal</text></a><rect x="264" y="142" width="292" height="27" fill="none" stroke="#805916" stroke-width="2"/><a href="../../kernel/filesystem/file_descriptor.header#L15"><text x="274" y="163" text-anchor="start" font-size="20" font-weight="bold" fill="#17313a">1 · stdout</text></a><a href="../../kernel/filesystem/file_descriptor.header#L19"><text x="546" y="163" text-anchor="end" font-size="20" font-weight="bold" fill="#17313a">TMP</text></a><a href="../../kernel/filesystem/file_descriptor.header#L15"><text x="274" y="190" text-a