<polyline points="850,415 905,415" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<text x="875" y="392" font-size="16" text-anchor="middle" font-weight="normal" fill="#17313a">writes</text>
<rect x="1200" y="245" width="265" height="100" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="1332.5" y="287.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">SRAM 0: 256K × 16</text>
<text x="1332.5" y="317.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">D[15:0] — lower half</text>
<rect x="1200" y="390" width="265" height="100" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="1332.5" y="432.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">SRAM 1: 256K × 16</text>
<text x="1332.5" y="462.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">D[31:16] — upper half</text>
<polyline points="1100,415 1150,415 1150,295 1200,295" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="1150,415 1150,440 1200,440" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<circle cx="1150" cy="415" r="3.5" fill="#637983"/>
<text x="1325" y="180" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">Shared A[17:0]</text>
<text x="1325" y="210" font-size="19" text-anchor="middle" font-weight="normal" fill="#17313a">CE / OE / WE / byte enables</text>
<text x="755" y="494" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">CPU configures peripherals through memory-mapped I/O</text>
</g></svg>
