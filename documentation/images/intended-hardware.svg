<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="530" viewBox="0 0 1490 530" role="img" aria-labelledby="title desc">
<title id="title">Intended physical hardware</title><desc id="desc">Host USB connects through a CH340C USB-to-UART adapter to the FPGA UART. UART bytes form 32-bit DMA words. CPU and DMA share the SRAM controller, which connects to two 16-bit SRAM chips with shared address and control signals. Timer, UART and DMA events reach the interrupt controller, which interrupts the CPU.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#637983"/></marker></defs>
<g font-family="Cantarell, sans-serif" fill="#17313a">
<rect x="385" y="25" width="740" height="485" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="755" y="62" font-size="27" text-anchor="middle" font-weight="bold" fill="#17313a">Alchitry Cu V2 FPGA</text>
<rect x="20" y="210" width="150" height="100" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="95.0" y="252.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">Host</text>
<text x="95.0" y="282.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#17313a">computer</text>
<rect x="225" y="210" width="135" height="100" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="292.5" y="252.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">CH340C</text>
<text x="292.5" y="282.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">USB–UART</text>
<polyline points="170,260 225,260" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="197" y="245" font-size="16" text-anchor="middle" font-weight="normal" fill="#17313a">USB</text>
<rect x="415" y="210" width="180" height="100" fill="#eaf5f5" stroke="#637983" stroke-width="2"/>
<text x="505.0" y="252.0" font-size="20" text-anchor="middle" font-weight="normal" fill="#17313a">UART controller</text>
<text x="505.0" y="282.0" font-size="20" text-anchor="middle" font-weight="normal" fill="#17313a">8-bit RX / TX</text>
<polyline points="360,260 415,260" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="388" y="245" font-size="15" text-anchor="middle" font-weight="normal" fill="#17313a">UART</text>
<rect x="650" y="90" width="440" height="80" fill="#eaf5f5" stroke="#637983" stroke-width="2"/>
<text x="870.0" y="137.0" font-size="23" text-anchor="middle" font-weight="normal" fill="#17313a">Timer + interrupt controller</text>
<rect x="775" y="210" width="190" height="100" fill="#eaf5f5" stroke="#637983" stroke-width="2"/>
<text x="870.0" y="252.0" font-size="23" text-anchor="middle" font-weight="normal" fill="#17313a">32-bit</text>
<text x="870.0" y="282.0" font-size="23" text-anchor="middle" font-weight="normal" fill="#17313a">RETI CPU</text>
<polyline points="870,170 870,210" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)"/>
<text x="890" y="195" font-size="17" text-anchor="start" font-weight="normal" fill="#17313a">interrupt</text>
<polyline points="505,210 505,130 650,130" fill="none" stroke="#637983" stroke-width="2.5" stroke-linejoin="miter" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="522" y="157" font-size="17" text-anchor="start" font-weight="normal" fill="#17313a">receive-ready</text>
<rect x="635" y="365" width="215" height="100" fill="#eaf5f5" stroke="#637983" stroke-width="2"/>
<text x="742.5" y="407.0" font-size="19" text-anchor="middle" font-weight="normal" fill="#17313a">Receive buffer + DMA</text>
<text x="742.5" y="437.0" font-size="19" text-anchor="middle" font-weight="normal" fill="#17313a">4 bytes → 32-bit word</text>
