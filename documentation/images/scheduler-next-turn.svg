<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Steps 4–5: the current process is last in the list</title>
<desc id="desc">PCB 5 is now current and PCB 5.next is NULL. After the dispatcher saves PCB 5&#x27;s context and sets its state to READY, the next scheduler call sets start and candidate to the head, PCB 1, and returns it because its state is READY. The dispatcher changes active_process to PCB 1, PCB 5&#x27;s state to READY, and PCB 1&#x27;s state to RUNNING. PCB 5.next remains NULL.</desc>
