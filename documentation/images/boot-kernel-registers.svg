<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc">
<title id="title">Register destinations after start_loaded_kernel</title>
<desc id="desc">Immediately after MOVE CS PC, before generated kernel startup runs. CS and PC point to kernel .text, DS to kernel .data, and SP and BAF to the highest kernel stack cell. The narrow cell at the end of the Kernel Stack marks stack_start. ACC, IN1 and IN2 retain the code, data and stack offsets, not absolute addresses. The old temporary stack is in the later Process and Shared Data Heap area. Addresses increase from left to right. SRAM labels are cell offsets. Memory widths are illustrative.</desc>
