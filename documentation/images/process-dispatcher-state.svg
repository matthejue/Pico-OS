<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="250" viewBox="0 0 1840 250" role="img" aria-labelledby="title desc"><title id="title">Outgoing PCB state during dispatcher_switch_from_context</title><desc id="desc">After copying the context, dispatcher_switch_from_context changes only state RUNNING to READY. BLOCKED from a wait and STOPPED from signal handling remain unchanged. READY can result from a wakeup or SIGCONT before selection and also remains unchanged. NEW and ZOMBIE are left untouched by the condition but are not normal outgoing resumable contexts. A NULL current process skips activation and state writes. All branches call dispatcher_start_next_process. The save step leaves other PCB states and active_process unchanged, before selection and dispatch update them.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1840" height="250" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="32" y="32" width="310" height="75" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../kernel/process/process.header#L33"><text x="187" y="60" text-anchor="middle" font-size="20" font-weight="normal" fill="#43576a">process-&gt;state</text></a><a href="../../kernel/process/process.header#L14"><text x="187" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#43576a">RUNNING</text></a><path d="M 350 69 H 494" 