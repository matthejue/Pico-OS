(shell_pid, NULL, NULL)</text></a><path d="M 960 420 V 457 M 340 457 H 1580" fill="none" stroke="#167b84" stroke-width="3"/><rect x="90" y="540" width="500" height="170" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 1</text></a><a href="../../library/stdlib/env.picoc#L160"><text x="340.0" y="631" text-anchor="middle" font-size="28" font-weight="normal" fill="#805916">unsetenv(&quot;PATH&quot;)</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="682" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH absent</text></a><rect x="90" y="916" width="500" height="130" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="960" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 4</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="1018" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH absent</text></a><path d="M 340 457 V 540" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="80" y="464" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="340" y="493" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid1, &quot;arg1&quot;, NULL)</text></a><path d="M 340 710 V 916" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="80" y="788" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="340" y="817" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid4, &quot;arg1&quot;, NULL)</text></a><rect x="710" y="540" width="500" height="170" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 2</text></a><a href="../../library/stdlib/env.picoc#L129"><text x="960.0" y="631" text-anchor="middle" font-size="28" font-weight="normal" fill="#805916">setenv(&quot;PATH&quot;, &quot;/test&quot;, true)</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="682" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH=/test</text></a><rect x="710" y="916" width="500" height="130" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="960" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 5</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="1018" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH=/test</text></a><path d="M 960 457 V 540" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="700" y="464" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="960" y="493" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid2, &quot;arg1&quot;, NULL)</text></a><path d="M 960 710 V 916" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="700" y="788" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="960" y="817" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid5, &quot;arg1&quot;, NULL)</text></a><rect x="1330" y="540" width="500" height="170" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="1580.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 3</text></a><text x="1580.0" y="631" text-anchor="middle" font-size="28"