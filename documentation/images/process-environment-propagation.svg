<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Environment origin and inheritance through three process branches</title><desc id="desc">The kernel loads system/init.bin with load_process, prepares an empty environment with init_request.environment = NULL and mark_process_ready_with_arguments, then starts init with dispatcher_start_next_process. Init starts with an empty environ array. Its read_environment function opens and reads config/environment.txt, then setenv stores PATH=/user in its own environ. Init passes PATH=/user to the shell with run(shell_pid, NULL, NULL). The shell starts three processes using run with a NULL environment argument. Process 1 removes PATH with unsetenv, process 2 changes PATH to /test with setenv, and process 3 leaves PATH=/user unchanged. Each starts its own child. Process 4 inherits no PATH, process 5 inherits PATH=/test, and process 6 inherits PATH=/user. Every box shows only PATH from its own environ after the local operation. Arrows show concrete run calls, not shared pointers.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="24" width="550" height="210" fill="#f4f8f8" stroke="#637983" stroke-width="2.5"/><a href="../../kernel/kernel.picoc#L31"><text x="307" y="62" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Kernel</text></a><a href="../../kernel/process/process_loader.picoc#L305"><text x="307" y="102" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">load_process(&quot;system/init.bin&quot;, ...)</text></a><a href="../../kernel/kernel.picoc#L48"><text x="307" y="139" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">init_request.environment = NULL</text></a><a href="../../kernel/process/process_arguments.picoc#L241"><text x="307" y="174" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">mark_process_ready_with_arguments(&amp;init_request)</text></a><a href="../../kernel/dispatcher.picoc#L55"><text x="307" y="212" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">dispatcher_start_next_process()</text></a><path d="M 582 102 L 710 102" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="646" y="89" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">loads</text><path d="M 582 204 L 710 204" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="646" y="191" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">starts</text><rect x="710" y="24" width="500" height="210" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../system/init.picoc#L101"><text x="960" y="62" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">init</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960" y="99" text-anchor="middle" font-size="24" font-weight="normal" fill="#17313a">Starts with an empty environ array</text></a><a href="../../system/init.picoc#L20"><text x="960" y="135" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">read_environment()</text></a><a href="../../library/stdlib/env.picoc#L129"><text x="960" y="172" text-anchor="middle" font-size="26" font-weight="normal" fill=