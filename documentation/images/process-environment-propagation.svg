<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="535" viewBox="0 0 1800 535" role="img" aria-labelledby="title desc"><title id="title">A run call copies the caller&#x27;s environment twice</title><desc id="desc">The shell calls run(child_pid, arg1 arg2, NULL). The library stores the caller&#x27;s environ pointer in the caller-local RunProcessRequest.environment. The kernel store_process_arguments function copies strings into the child&#x27;s initial stack and builds the envp pointer array for them. At first dispatch, start_process calls initialize_environment, which creates the child&#x27;s independent heap array and strings and assigns the child&#x27;s environ global. Solid arrows are stored pointers and dashed arrows are copies. The PCB stores activation.sp, activation.baf and state, but no environment pointer.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1800" height="535" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="32" text-anchor="start" font-size="26" font-weight="bold" fill="#43576a">2. One run() call: caller → child stack → child heap</text><rect x="32" y="60" width="520" height="400" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../user/shell.picoc#L1034"><text x="292.0" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#43576a">Caller: shell process</text></a><a href="../../library/unistd/process.picoc#L31"><text x="292" y="132" text-anchor="middle" font-size="24" font-weight="bold" fill="#43576a">run(child_pid, &quot;arg1 arg2&quot;, NULL)</text></a><rect x="52" y="148" width="480" height="109" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../common/syscall.header#L55"><text x="292" y="176" text-anchor="middle" font-size="19" font-weight="bold" fill="#43576a">RunProcessRequest request (caller stack)</text></a><a href="../../common/syscall.header#L55"><text x="292" y="204" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">pid = child_pid, arguments = &quot;arg1 arg2&quot;</text></a><a href="../../library/unistd/process.picoc#L37"><text x="292" y="234" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">environment = current_environment()</text></a><a href="../../library/stdlib/env.picoc#L6"><text x="292" y="298" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">current_environment() returns environ</text></a><path d="M 52 234 H 16 V 403 H 52" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><rect x="52" y="325" width="480" height="135" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../library/stdlib/env.picoc#L4"><text x="292.0" y="353" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">.data: environ</text></a><path d="M 292.0 362 L 292.0 380" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="292.0" y="404" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PATH=/user&quot;</text><a href="../../common/loading_bar.header#L5"><text x="292.0" y="433" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PICOOS_LOADING_BAR=true&quot;</text></a><text x="292.0" y="454" text-anchor="middle" font-size="17" font-weight="normal" fill="#43576a">Heap: pointer array + strings + NULL</text><text x="292" y="491" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Caller keeps its own heap array and strings</text><rect x="720" y="60" width="480" height="400" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../kernel/process/process_arguments.picoc#L125"><text x="960.0" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#43576a">Kernel: prepares child stack</text></a><a href="../../kernel/process/process_arguments.picoc#L125"><text x="960" y="154" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">store_process_arguments(</text></a><a href="../../kernel/process/process_arguments.picoc#L125"><text x="960" y="190" text-anchor="middle" font-size="23" font-weight="normal" fill="#43576a">process, request.arguments,</text></a><a href="../../common/syscall.header#L58"><text x="960" y="226" text-anchor="middle" font-size="23" font-weight="normal" fill="#43576a">request.environment)</text></a><text x="960" y="285" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Writes into the child&#x27;s User Process Stack</text><rect x="740" y="325" width="440" height="135" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../kernel/process/process_arguments.picoc#L141"><text x="960.0" y="353" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">Child&#x27;s initial stack: envp</text></a><path d="M 960.0 362 L 960.0 380" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="960.0" y="404" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PATH=/user&quot;</text><a href="../../common/loading_bar.header#L5"><text x="960.0" y="433" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PICOOS_LOADING_BAR=true&quot;</text></a><text x="960.0" y="454" text-anchor="middle" font-size="17" font-weight="normal" fill="#43576a">Stack: pointer array + strings + NULL</text><text x="626" y="363" text-anchor="middle" font-size="23" font-weight="bold" fill="#405ea8">1. copy</text><path d="M 532 403 L 740 403" fill="none" stroke="#405ea8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#405ea8)"/><rect x="1330" y="60" width="438" height="400" fill="white" stroke="#43576a" stroke-width="2"/><a href="../../library/start/start.picoc#L7"><text x="1549.0" y="94" text-anchor="middle" font-size="26" font-weight="bold" fill="#43576a">Child: first dispatch</text></a><a href="../../library/start/start.picoc#L7"><text x="1549" y="155" text-anchor="middle" font-size="23" font-weight="normal" fill="#43576a">start_process() calls</text></a><a href="../../library/stdlib/env.picoc#L97"><text x="1549" y="192" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">initialize_environment(envp)</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="1549" y="243" text-anchor="middle" font-size="23" font-weight="normal" fill="#43576a">Assigns child&#x27;s own environ</text></a><text x="1549" y="285" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Allocates in child&#x27;s User Process Heap</text><rect x="1350" y="325" width="398" height="135" fill="#deecff" stroke="#43576a" stroke-width="1"/><a href="../../library/stdlib/env.picoc#L4"><text x="1549.0" y="353" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">.data: environ</text></a><path d="M 1549.0 362 L 1549.0 380" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><text x="1549.0" y="404" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PATH=/user&quot;</text><a href="../../common/loading_bar.header#L5"><text x="1549.0" y="433" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">&quot;PICOOS_LOADING_BAR=true&quot;</text></a><text x="1549.0" y="454" text-anchor="middle" font-size="17" font-weight="normal" fill="#43576a">Heap: pointer array + strings + NULL</text><text x="1265" y="363" text-anchor="middle" font-size="23" font-weight="bold" fill="#405ea8">2. copy</text><path d="M 1180 403 L 1350 403" fill="none" stroke="#405ea8" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#405ea8)"/><a href="../../library/stdlib/env.picoc#L126"><text x="1549" y="491" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Later setenv() affects only this process</text></a><a href="../../kernel/process/process_arguments.picoc#L241"><text x="960" y="491" text-anchor="middle" font-size="20" font-weight="normal" fill="#43576a">PCB: activation.sp / activation.baf updated</text></a><a href="../../kernel/process/process.header#L31"><text x="960" y="525" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">state = READY, no environment pointer</text></a></g></svg>
