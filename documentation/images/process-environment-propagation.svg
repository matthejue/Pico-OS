<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Environment inheritance through three process branches</title><desc id="desc">Init passes PATH=/user to the shell with run(shell_pid, NULL, NULL). The shell starts three processes using run with a NULL environment argument. Process 1 removes PATH with unsetenv, process 2 changes PATH to /test with setenv, and process 3 leaves PATH=/user unchanged. Each starts its own child. Process 4 inherits no PATH, process 5 inherits PATH=/test, and process 6 inherits PATH=/user. Every box shows only PATH from its own environ after the local operation. Arrows show concrete run calls, not shared pointers.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1920" height="1080" fill="white"/><g font-family="Cantarell, sans-serif"><rect x="710" y="24" width="500" height="130" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../system/init.picoc#L100"><text x="960.0" y="68" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">init</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="126" text-anchor="middle" font-size="32" font-weight="normal" fill="#167b84">PATH=/user</text></a><rect x="710" y="250" width="500" height="130" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../user/shell.picoc"><text x="960.0" y="294" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">shell</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="352" text-anchor="middle" font-size="32" font-weight="normal" fill="#167b84">PATH=/user</text></a><path d="M 960 154 V 250" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="700" y="182" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="960" y="211" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(shell_pid, NULL, NULL)</text></a><path d="M 960 380 V 427 M 340 427 H 1580" fill="none" stroke="#167b84" stroke-width="3"/><rect x="90" y="540" width="500" height="170" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 1</text></a><a href="../../library/stdlib/env.picoc#L157"><text x="340.0" y="631" text-anchor="middle" font-size="28" font-weight="normal" fill="#805916">unsetenv(&quot;PATH&quot;)</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="682" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH absent</text></a><rect x="90" y="916" width="500" height="130" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="960" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 4</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="340.0" y="1018" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH absent</text></a><path d="M 340 427 V 540" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="80" y="464" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="340" y="493" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid1, &quot;arg1&quot;, NULL)</text></a><path d="M 340 710 V 916" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="80" y="788" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="340" y="817" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid4, &quot;arg1&quot;, NULL)</text></a><rect x="710" y="540" width="500" height="170" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 2</text></a><a href="../../library/stdlib/env.picoc#L126"><text x="960.0" y="631" text-anchor="middle" font-size="28" font-weight="normal" fill="#805916">setenv(&quot;PATH&quot;, &quot;/test&quot;, true)</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="682" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH=/test</text></a><rect x="710" y="916" width="500" height="130" fill="#d8efef" stroke="#805916" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="960" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 5</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="960.0" y="1018" text-anchor="middle" font-size="32" font-weight="bold" fill="#805916">PATH=/test</text></a><path d="M 960 427 V 540" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="700" y="464" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="960" y="493" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid2, &quot;arg1&quot;, NULL)</text></a><path d="M 960 710 V 916" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="700" y="788" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="960" y="817" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid5, &quot;arg1&quot;, NULL)</text></a><rect x="1330" y="540" width="500" height="170" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="1580.0" y="584" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 3</text></a><text x="1580.0" y="631" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">no change</text><a href="../../library/stdlib/env.picoc#L4"><text x="1580.0" y="682" text-anchor="middle" font-size="32" font-weight="normal" fill="#167b84">PATH=/user</text></a><rect x="1330" y="916" width="500" height="130" fill="#d8efef" stroke="#167b84" stroke-width="2.5"/><a href="../../library/stdlib/env.picoc#L4"><text x="1580.0" y="960" text-anchor="middle" font-size="32" font-weight="bold" fill="#17313a">Process 6</text></a><a href="../../library/stdlib/env.picoc#L4"><text x="1580.0" y="1018" text-anchor="middle" font-size="32" font-weight="normal" fill="#167b84">PATH=/user</text></a><path d="M 1580 427 V 540" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="1320" y="464" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="1580" y="493" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid3, &quot;arg1&quot;, NULL)</text></a><path d="M 1580 710 V 916" fill="none" stroke="#167b84" stroke-width="3" marker-end="url(#405ea8)"/><rect x="1320" y="788" width="520" height="39" fill="white" stroke="none" stroke-width="1"/><a href="../../library/unistd/process.picoc#L31"><text x="1580" y="817" text-anchor="middle" font-size="28" font-weight="normal" fill="#17313a">run(cpid6, &quot;arg1&quot;, NULL)</text></a></g></svg>
