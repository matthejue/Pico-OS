<svg xmlns="http://www.w3.org/2000/svg" width="2174" height="611" viewBox="0 0 2174 611" role="img" aria-labelledby="title desc">
<title id="title">SRAM layout and heap hierarchy</title>
<desc id="desc">Kernel .ivt, .text and .data are adjacent linked sections. The Kernel Heap follows the Kernel Image, then the Kernel Stack. The Process and Shared Data Heap follows the entire Kernel region. Each heap contains three illustrative blocks linked by next, with a free payload behind its final header. Both kernel heap descriptors and process-list and shared-memory roots are globals in kernel .data.</desc>
