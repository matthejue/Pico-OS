<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="490" viewBox="0 0 1760 490" role="img" aria-labelledby="title desc"><title id="title">One user-process stack in the SRAM hierarchy</title><desc id="desc">The complete SRAM contains a Kernel area and the Process and Shared Data Heap. Each process is one independent allocator payload containing a User Process Image, User Process Heap and User Process Stack. Process Payload A and its User Process Stack are highlighted with matching blue fills and thick red outlines.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1760" height="490" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="32" text-anchor="start" font-size="23" font-weight="bold" fill="#43576a">One user-process stack in the SRAM hierarchy</text><text x="32" y="61" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Lower addresses → higher addresses · widths are illustrative</text><rect x="32" y="100" width="430" height="90" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="247.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Kernel area</text><text x="247.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">image · heap · stack</text><rect x="462" y="100" width="100" height="90" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="512.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="512.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">Header A</text><rect x="562" y="100" width="360" height="90" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="742.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Process Payload A</text><text x="742.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">one user process</text><rect x="922" y="100" width="100" height="90" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="972.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="972.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">Header B</text><rect x="1022" y="100" width="330" height="90" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1187.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Process Payload B</text><text x="1187.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">another user process</text><rect x="1352" y="100" width="370" height="90" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1537.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Other outer blocks</text><text x="1537.0" y="160.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">processes · shared data · free space</text><rect x="32" y="100" width="1690" height="90" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="32" y="190" width="430" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="247.0" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Kernel area</text><rect x="462" y="190" width="1260" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1092.0" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Process and Shared Data Heap</text><rect x="32" y="320" width="150" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="107.0" y="375.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">optional .ivt</text><rect x="182" y="320" width="300" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="332.0" y="364.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.text</text><text x="332.0" y="385.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">program + libraries</text><rect x="482" y="320" width="260" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="612.0" y="364.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.data</text><text x="612.0" y="385.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">process globals</text><rect x="742" y="320" width="470" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="977.0" y="364.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Heap</text><text x="977.0" y="385.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">independent allocator</text><rect x="1212" y="320" width="510" height="100" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="1467.0" y="364.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Stack</text><text x="1467.0" y="385.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">grows toward lower addresses ←</text><rect x="32" y="320" width="1690" height="100" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="32" y="420" width="710" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="387.0" y="441" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Image</text><rect x="742" y="420" width="470" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="977.0" y="441" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Heap</text><rect x="1212" y="420" width="510" height="30" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="1467.0" y="441" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Stack</text><path d="M 562 190 L 32 320 M 922 190 L 1722 320" fill="none" stroke="#96a3ae" stroke-dasharray="5 4"/><text x="32" y="300" text-anchor="start" font-size="16" font-weight="bold" fill="#43576a">Expand Process Payload A · outer header remains outside the payload</text><rect x="562" y="100" width="360" height="90" fill="none" stroke="#9c3d15" stroke-width="4"/><rect x="1212" y="320" width="510" height="130" fill="none" stroke="#9c3d15" stroke-width="4"/></g></svg>
