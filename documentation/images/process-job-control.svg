<svg xmlns="http://www.w3.org/2000/svg" width="1834" height="670" viewBox="0 0 1834 670" role="img" aria-labelledby="title desc"><title id="title">Foreground and background job storage in SRAM</title><desc id="desc">An illustrative foreground snapshot after fg resumes tracked child PID 2. Shell PID 1 is waiting for it. Kernel .data stores the integer foreground_process_target = +2. The dashed arrow represents find_process_by_pid, which scans the global PCB list, not a stored PCB pointer. PCB 1 and PCB 2 are separate kmalloc payloads in the Kernel Heap, each after a BlockHeader. Their base_address integers store addresses of separate PSDMalloc Process Payloads in the Process and Shared Data Heap. The lower row expands the shell payload into .text, .data, User Process Heap and User Process Stack. The shell globals last_background_process_id = 2 and last_command_exit_status = 0 are inline integers, not allocations or pointers. The exit status is an example previous command result, not the result of the pending wait. PID 2 remains tracked during fg. Other PCB fields, wait links, descriptor allocations and allocator links are omitted.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1834" height="670" fill="white"/><g font-family="Cantarell, sans-serif"><rect x="32" y="190" width="120" height="140" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><tex