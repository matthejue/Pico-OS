<svg xmlns="http://www.w3.org/2000/svg" width="1294" height="292" viewBox="0 0 1294 292" role="img" aria-labelledby="title desc">
<title id="title">Free D: mark its header free before the merge scan</title>
<desc id="desc">One continuous horizontal heap region with adjacent headers and payloads sharing divider lines. Curved next arrows link headers in address order. Green payloads are free, teal payloads are allocated, and the amber outline marks the changed or selected block. Widths preserve memory positions across steps but are not to scale in cells.</desc>
