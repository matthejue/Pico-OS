<svg xmlns="http://www.w3.org/2000/svg" width="2669" height="611" viewBox="0 0 2669 611" role="img" aria-labelledby="title desc">
<title id="title">Shared Memory Entries manage Shared Data Payloads</title>
<desc id="desc">Two SharedMemoryEntry objects are separate Kernel Heap payloads. The independent global shared_memory_list_head in kernel .data points to the first entry, linked to the second by next. Their address fields point to separate Shared Data Payloads behind outer headers A and C.</desc>
