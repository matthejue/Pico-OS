<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="535" viewBox="0 0 1800 535" role="img" aria-labelledby="title desc"><title id="title">Install redirected shell stdout and close the temporary descriptor</title><desc id="desc">The SRAM overview contains the Kernel Image, Kernel Heap, Kernel Stack and Process and Shared Data Heap. The emulator host stores /output.txt outside SRAM. Dashed guides expand the Kernel Heap into PCB 1 for the shell, its FileDescriptorTable and its contiguous eight-entry array. Each object and each path string has its own BlockHeader. Only entries 1, 3 and 6 have their path allocations expanded. STDIN, STDOUT, STDERR, FILE and FREE abbreviate FILE_DESCRIPTOR constants. Amber outlines mark changed entries. Other allocations, flags and offsets are omitted. Pointers are solid arrows, not file-data transfers. The child&#x27;s pre-run table is omitted. Block letters and widths do not specify allocation order or sizes.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1800" height="535" fill="white"/><g font-family="Cantarell, sans-serif"><text x="32" y="28" text-anchor="start" font-size="16" font-weight="normal" fill="#17313a">SRAM · lower addresses → higher addresses</text><rect x="32" y="45" width="55" height="70" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="59.5" y="85.0" text-anchor="middle" font-size