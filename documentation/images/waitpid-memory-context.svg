<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="800" viewBox="0 0 1760 800" role="img" aria-labelledby="title desc"><title id="title">Where waitpid executes and keeps its state</title><desc id="desc">One CPU executes kernel and userspace instructions at different times. It fetches the syscall ISR, wait handler and dispatcher from kernel .text, and waitpid and its helper from the parent&#x27;s .text. Live registers belong to the CPU. SRAM is shown in increasing address order: Kernel Image, Kernel Heap, Kernel Stack, Process and Shared Data Heap. Kernel .data contains active_process. PCB 1 for the parent and PCB 2 for the child are Kernel Heap allocations. PCB 1 embeds activation and waiting_status_ptr. PCB 2 embeds waiters, whose head points to PCB 1 during the wait. The parent&#x27;s Process Payload A contains its image, heap and stack. The expanded user stack contains the saved interrupt registers, the saved PC, WaitPidRequest request, and the separate int status. request.status and waiting_status_ptr point to status. activation.sp points to the saved ACC cell, immediately below the saved PC. Dashed guides enlarge the same storage. Other allocations and stack cells are omitted. Widths are illustrative.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="20" width="1696" height="136" fill="white" stroke="#637983" stroke-width="2"/><text x="52" y="51" text-anchor="start" font-size="25" font-weight="bold" fill="#17313a">CPU · kernel and user code execute here at different times</text><rect x="52" y="66" width="620" height="74" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../interrupt_service_routines/os_isrs.picoc#L94"><text x="362.0" y="94" text-anchor="middle" font-size="22" font-weight="bold" fill="#17313a">Kernel code</text></a><a href="../../interrupt_service_routines/os_isrs.picoc#L94"><text x="362.0" y="124" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">syscall_interrupt → wait handler → dispatcher</text></a><rect x="692" y="66" width="620" height="74" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L15"><text x="1002.0" y="94" text-anchor="middle" font-size="22" font-weight="bold" fill="#17313a">Parent&#x27;s user code</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="1002.0" y="124" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waitpid → helper → INT 0 → resumed helper</text></a><rect x="1332" y="66" width="376" height="74" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="1520.0" y="94" text-anchor="middle" font-size="22" font-weight="bold" fill="#17313a">Live CPU registers</text><text x="1520.0" y="124" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PC · CS · DS · SP · BAF …</text><text x="32" y="215" text-anchor="start" font-size="25" font-weight="bold" fill="#17313a">SRAM · lower addresses → higher addresses</text><text x="1728" y="215" text-anchor="end" font-size="17" font-weight="normal" fill="#17313a">Widths are illustrative</text><rect x="32" y="236" width="60" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../interrupt_service_routines/os_isrs.picoc#L23"><text x="62.0" y="286.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.ivt</text></a><rect x="92" y="236" width="180" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../interrupt_service_routines/os_isrs.picoc#L94"><text x="182.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.text</text></a><a href="../../interrupt_service_routines/os_isrs.picoc#L94"><text x="182.0" y="296.5" text-anchor="middle" font-size="14.986619090098127" font-weight="normal" fill="#17313a">kernel instructions</text></a><rect x="272" y="236" width="170" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.picoc#L18"><text x="357.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.data</text></a><a href="../../kernel/process/process.picoc#L18"><text x="357.0" y="296.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#17313a">active_process</text></a><rect x="442" y="236" width="290" height="90" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L31"><text x="587.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">PCB 1 · PCB 2</text></a><a href="../../kernel/process/process.header#L31"><text x="587.0" y="296.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#17313a">other allocations</text></a><rect x="732" y="236" width="160" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="812.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">kernel calls</text><text x="812.0" y="296.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#17313a">grows ←</text><rect x="892" y="236" width="60" height="90" fill="#eaf3f4" stroke="#637983" stroke-width="1"/><a href="../../common/heap.header#L5"><text x="922.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">Block</text></a><a href="../../common/heap.header#L5"><text x="922.0" y="296.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#17313a">Header A</text></a><rect x="952" y="236" width="260" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L5"><text x="1082.0" y="265.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#