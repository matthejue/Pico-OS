><rect x="1298" y="530" width="250" height="142" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../common/syscall.header#L61"><text x="1423.0" y="559" text-anchor="middle" font-size="21" font-weight="bold" fill="#17313a">WaitPidRequest</text></a><a href="../../common/syscall.header#L62"><text x="1423.0" y="589" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">request.pid = child PID</text></a><a href="../../common/syscall.header#L63"><text x="1423.0" y="619" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">request.status = &amp;status</text></a><rect x="1548" y="530" width="160" height="142" fill="#fff1d6" stroke="#637983" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L16"><text x="1628.0" y="559" text-anchor="middle" font-size="21" font-weight="bold" fill="#17313a">int status</text></a><text x="1628.0" y="589" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">0 → result</text><text x="1370" y="701" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">Other stack frames / cells omitted</text><text x="1370" y="727" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">Stack grows toward lower addresses ←</text><path d="M 52 626 H 16 V 752 H 1000 V 672" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../kernel/dispatcher.picoc#L75"><text x="650" y="745" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">activation.sp → saved ACC cell</text></a><path d="M 442 658 H 774 V 778 H 1628 V 672" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../kernel/process/process.header#L44"><text x="1050" y="774" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">waiting_status_ptr → status</text></a><path d="M 1423 530 V 523 H 1628 V 530" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/></g></svg>
