<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="890" viewBox="0 0 1800 890" role="img" aria-labelledby="title desc"><title id="title">Restore PCB 5.activation and return through its user stack with RTI</title><desc id="desc">Three separate regions show PCB 5 in SRAM&#x27;s Kernel Heap, the CPU, and PCB 5&#x27;s user stack and code in SRAM&#x27;s Process Payload A. activation is embedded in PCB 5. Its seven fields are shown in struct order and arrows copy their values into CPU registers. Numbered actions show SP restored first, the periphery stack boundary installed second, and the remaining registers restored third, with BAF last. The SP register stores an address pointing to the saved ACC cell in the user stack. SP and SP + 1 in the stack&#x27;s address column denote SRAM addresses, not registers. RTI actually reads the saved PC from the cell at SP + 1, advances SP by one, and sets the CPU PC to saved PC + 1 to resume in the selected process&#x27;s .text. The stack addresses are shown before RTI. The separate memory-mapped STACK_HEAP_BOUNDARY_REGISTER detects stack growth into the user heap.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1800" height="890" fill="white"/><g font-family="Cantarell, sans-serif"><rect x="32" y="32" width="500" height="590" fill="white" stroke="#637983" stroke-width="2"/><text x="282" y="70" text-anchor