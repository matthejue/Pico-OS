<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1120" viewBox="0 0 2200 1120" role="img" aria-labelledby="title desc"><title id="title">Restore PCB 5.activation and return through its user stack with RTI</title><desc id="desc">The same SRAM regions as the save diagram now contain the selected PCB 5. active_process already points to PCB 5 and its state is RUNNING. The naked function reads process from kernel entry SP + 2 into BAF and stack_boundary from SP + 3 into IN1. BAF temporarily addresses the PCB. Fixed PCB offsets restore SP first, then the stack boundary, then CS, DS, IN1, IN2, ACC and BAF last. The lower panels show the loads in execution order. RTI reads the saved PC at restored SP + 1, increments SP and continues at saved PC + 1. PC is not a PCB activation field.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="2200" height="1120" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="32" y="270" width="60" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="62.0" y="350.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.ivt</text><rect x="92" y="270" width="100" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="142.0" y="339.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.text</text><text x="142.0" y="360.5" text-anchor="mid