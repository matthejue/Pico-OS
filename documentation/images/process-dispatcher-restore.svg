1"/><a href="../../kernel/process/process.header#L23"><text x="94" y="310" text-anchor="start" font-size="25" font-weight="normal" fill="#17313a">activation.in2</text></a><text x="469" y="310" text-anchor="end" font-size="21" font-weight="normal" fill="#17313a">PCB + 9</text><rect x="800" y="276" width="270" height="52" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="935" y="310" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">IN2</text><path d="M 497 302 H 795" fill="none" stroke="#637983" stroke-width="2" marker-end="url(#785099)"/><rect x="72" y="328" width="420" height="52" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L24"><text x="94" y="362" text-anchor="start" font-size="25" font-weight="normal" fill="#17313a">activation.acc</text></a><text x="469" y="362" text-anchor="end" font-size="21" font-weight="normal" fill="#17313a">PCB + 10</text><rect x="800" y="328" width="270" height="52" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="935" y="362" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">ACC</text><path d="M 497 354 H 795" fill="none" stroke="#637983" stroke-width="2" marker-end="url(#785099)"/><rect x="72" y="380" width="420" height="52" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L25"><text x="94" y="414" text-anchor="start" font-size="25" font-weight="normal" fill="#17313a">activation.sp</text></a><text x="469" y="414" text-anchor="end" font-size="21" font-weight="normal" fill="#17313a">PCB + 11</text><rect x="800" y="380" width="270" height="52" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="935" y="414" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">SP · stack pointer</text><path d="M 497 406 H 795" fill="none" stroke="#25734f" stroke-width="2" marker-end="url(#26715b)"/><rect x="72" y="432" width="420" height="52" fill="#d8efef" stroke="#637983" stroke