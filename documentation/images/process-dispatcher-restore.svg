<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="890" viewBox="0 0 1800 890" role="img" aria-labelledby="title desc"><title id="title">Restore PCB 1.activation and return through its user stack with RTI</title><desc id="desc">This standalone example uses PCB 1 as the selected process. Three separate regions show PCB 1 in SRAM&#x27;s Kernel Heap, the CPU, and PCB 1&#x27;s user stack and code in SRAM&#x27;s Process Payload A. activation is embedded in PCB 1. Its seven fields are shown in struct order and arrows copy their values into CPU registers. The PCB and stack tables each show lower addresses at the top and higher addresses at the bottom, with downward address-order arrows. The user process image is above the heap, which is above the stack, matching SRAM address order. Circled action numbers show SP restored first, the periphery stack boundary installed second, and the remaining registers restored third, with BAF last. Step 4 executes the CPU instruction RTI, meaning return from interrupt. Step numbers describe the action order, not process numbers. The SP register stores an address pointing to the saved ACC cell in the user stack. SP and SP + 1 in the stack&#x27;s address column denote SRAM addresses, not registers. RTI actually reads the saved PC from the cell at SP + 1, advances SP by one, and sets the CPU PC to saved PC + 1 to resume in the selected process&#x27;s .text. The stack addresses are shown before RTI. The separate memory-mapped STACK_HEAP_BOUNDARY_REGISTER detects stack growth into the user heap.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path 