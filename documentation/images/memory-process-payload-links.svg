<svg xmlns="http://www.w3.org/2000/svg" width="2354" height="611" viewBox="0 0 2354 611" role="img" aria-labelledby="title desc">
<title id="title">From PCBs to Process Payloads in SRAM</title>
<desc id="desc">Kernel .ivt, .text and .data form the Kernel Image, followed by the Kernel Heap and Kernel Stack. The Process and Shared Data Heap follows the Kernel area. Each depicted heap has three Block Headers A, B and C. Kernel Heap Payloads A and C contain PCB 1 and PCB 2. Kernel Heap Payload B contains one SharedMemoryEntry. The PCBs&#x27; base_address fields reach Process Payloads A and C. Both addresses identify payload cells immediately after the corresponding outer headers.</desc>
