<svg xmlns="http://www.w3.org/2000/svg" width="1669" height="612" viewBox="0 0 1669 612" role="img" aria-labelledby="title desc"><title id="title">Per-process file-descriptor allocations in SRAM</title><desc id="desc">The Kernel Image contains .ivt, .text and .data, followed by the Kernel Heap, Kernel Stack, and Process and Shared Data Heap. Dashed lines expand the Kernel Heap below. PCB 1, FileDescriptorTable, the eight-element FileDescriptor array, and copied path strings occupy separate kmalloc payloads, each preceded by a BlockHeader. PCB 1&#x27;s file_descriptors pointer reaches the table payload. Its entries pointer reaches the start of the contiguous array, whose elements have no individual block headers. Descriptor 3&#x27;s path points to a copied /notes.txt string. Standard descriptors have separate terminal path copies, omitted along with other allocations. Header letters identify the illustrated blocks, not a fixed allocation order.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1669" height="612" fill="white"/><g font-family="Cantarell, sans-serif"><g transform="translate(0,-48)"><rect x="32" y="80" width="60" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="62.0" y="130.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">.ivt</text><rect x="92" y="80" width="110" height="90" fill="#f4f8f8" 