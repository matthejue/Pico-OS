<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc">
<title id="title">Register destinations after bootloader _start</title>
<desc id="desc">Immediately after MOVE ACC PC, before boot_main creates its stack frame. CS points to EPROM offset zero, ACC and PC to boot_main in bootloader .text, DS to bootloader .data, and SP and BAF to the highest SRAM cell. Green dashed arrows show absolute register addresses. The narrow final SRAM cell is the initial temporary stack location. Addresses increase from left to right. SRAM labels are cell offsets. Memory widths are illustrative.</desc>
<defs><marker id="address" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#25734f"/></marker></defs>
