<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="245" viewBox="0 0 1600 245" role="img" aria-labelledby="title desc">
<title id="title">PCB list with process_list_head and active_process</title>
<desc id="desc">Five PCBs are connected from left to right by ProcessControlBlock.next. PCB 5.next is NULL. The two global variables appear on the left. process_list_head points to PCB 1 and active_process points to PCB 3, whose state is RUNNING. Other state values are READY, BLOCKED, STOPPED and READY.</desc>
