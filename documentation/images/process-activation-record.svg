<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="620" viewBox="0 0 1760 620" role="img" aria-labelledby="title desc"><title id="title">Saved registers embedded in a process control block</title><desc id="desc">PCB 1 is one Kernel Heap allocation. Its first eight cells precede the embedded activation record at PCB offsets 8 through 14. The seven fields are in1, in2, acc, sp, baf, cs and ds. Later PCB fields start at offset 15. Dashed lines enlarge the same embedded record, not a separate allocation. active_process points to the current PCB. dispatcher_switch_from_context writes the current PCB&#x27;s record, and dispatcher_jump_to_process reads the selected PCB&#x27;s record. Saved sp points one cell below the saved PC on that process&#x27;s stack. Stack addresses increase from left to right. RTI reads the PC at sp + 1, increments SP and advances PC.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1760" height="620" fill="white"/><g font-family="Cantarell, sans-serif"><a href="../../kernel/process/process.picoc#L18"><text x="32" y="32" text-anchor="start" font-size="22" font-weight="normal" fill="#167b84">active_process</text></a><path d="M 202 25 H 250 Q 270 25 270 45 V 100" fill="none" stroke="#167b84" stroke-width="2" marker-end="url(#405ea8)"/><a href="../../kernel/process/process.header#L31"><text x="32" y="75" text-anchor="start" font-size="23" font-weight="bold" fill="#17313a">PCB 1</text></a><rect x="32" y="100" width="520" height="140" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="292" y="129" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">PCB cells 0–7</text><a href="../../kernel/process/process.header#L32"><text x="52" y="157" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">pid</text></a><a href="../../kernel/process/process.header#L33"><text x="52" y="181" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">state</text></a><a href="../../kernel/process/process.header#L34"><text x="52" y="205" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">base_address</text></a><a href="../../kernel/process/process.header#L35"><text x="52" y="229" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">size</text></a><a href="../../kernel/process/process.header#L36"><text x="292" y="157" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">heap_start</text></a><a href="../../kernel/process/process.header#L37"><text x="292" y="181" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">heap_size</text></a><a href="../../kernel/process/process.header#L38"><text x="292" y="205" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">binary_path</text></a><a href="../../kernel/process/process.header#L39"><text x="292" y="229" text-anchor="start" font-size="18" font-weight="normal" fill="#17313a">working_directory</text></a><rect x="552" y="100" width="760" height="140" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L40"><text x="932" y="136" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">activation</text></a><a href="../../kernel/process/process.header#L21"><text x="932" y="171" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">Embedded ActivationRecord</text></a><text x="932" y="210" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB cells 8–14</text><rect x="1312" y="100" width="416" height="140" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="1520" y="129" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">PCB cells 15 onward</text><a href="../../kernel/process/process.header#L42"><text x="1520" y="162" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">file_descriptors</text></a><a href="../../kernel/process/process.header#L44"><text x="1520" y="192" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waiting_status_ptr</text></a><a href="../../kernel/process/process.header#L31"><text x="1520" y="223" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">Other PCB attributes …</text></a><rect x="552" y="100" width="760" height="140" fill="none" stroke="#805916" stroke-width="3"/><path d="M 552 240 L 272 335 M 1312 240 L 1462 335" fill="none" stroke="#9db7bc" stroke-dasharray="5 4"/><rect x="272" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="357" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 8</text><a href="../../kernel/process/process.header#L22"><text x="357" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">in1</text></a><rect x="442" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="527" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 9</text><a href="../../kernel/process/process.header#L23"><text x="527" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">in2</text></a><rect x="612" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="697" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 10</text><a href="../../kernel/process/process.header#L24"><text x="697" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">acc</text></a><rect x="782" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="867" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 11</text><a href="../../kernel/process/process.header#L25"><text x="867" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">sp</text></a><rect x="952" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="1037" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 12</text><a href="../../kernel/process/process.header#L26"><text x="1037" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">baf</text></a><rect x="1122" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="1207" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 13</text><a href="../../kernel/process/process.header#L27"><text x="1207" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">cs</text></a><rect x="1292" y="335" width="170" height="85" fill="#d8efef" stroke="#637983" stroke-width="1"/><text x="1377" y="364" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">PCB + 14</text><a href="../../kernel/process/process.header#L28"><text x="1377" y="397" text-anchor="middle" font-size="24" font-weight="bold" fill="#17313a">ds</text></a><rect x="272" y="335" width="1190" height="85" fill="none" stroke="#805916" stroke-width="3"/><text x="1410" y="482" text-anchor="middle" font-size="22" font-weight="bold" fill="#17313a">Process stack</text><rect x="1100" y="505" width="290" height="70" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><rect x="1390" y="505" width="290" height="70" fill="#eaf3f4" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L25"><text x="1245" y="534" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">activation.sp</text></a><text x="1245" y="560" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">One cell below saved PC</text><a href="../../kernel/process/process.header#L25"><text x="1535" y="534" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">activation.sp + 1</text></a><text x="1535" y="560" text-anchor="middle" font-size="22" font-weight="bold" fill="#17313a">Saved PC</text><text x="1390" y="602" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">Lower addresses → higher addresses</text><path d="M 867 420 C 867 465 1245 455 1245 505" fill="none" stroke="#167b84" stroke-width="2" marker-end="url(#405ea8)"/></g></svg>
