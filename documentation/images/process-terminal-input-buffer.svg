<svg xmlns="http://www.w3.org/2000/svg" width="1669" height="612" viewBox="0 0 1669 612" role="img" aria-labelledby="title desc"><title id="title">Global terminal storage and reader queue in SRAM</title><desc id="desc">The Kernel Image contains .ivt, .text and .data, followed by the Kernel Heap, Kernel Stack, and Process and Shared Data Heap. The expanded view shows the global struct Terminal terminal embedded in kernel .data. Its input_buffer is an embedded 128-cell array, followed by the integer indices input_head and input_tail, input_count, and the embedded wait_queue input_waiters. None of this terminal storage is allocated on a heap or preceded by a BlockHeader. In this example the ring is empty, both indices are zero, and input_count is zero. Buffer contents are unspecified. input_waiters.head and input_waiters.tail both point to PCB 1, the one foreground process waiting for input. PCB 1 is a separate Kernel Heap payload after Block Header A. Its state is PROCESS_STATE_BLOCKED, wait_next is NULL, and waiting_queue_ptr points back to the embedded input_waiters queue. Other globals, heap allocations and PCB fields are omitted. Descriptors select the terminal by device path, not a stored pointer.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1669" height="612" fill="white"/><g font-family="DejaVu Sans, sans-serif"><g transform="translate(0 