<rect x="550" y="234" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="234" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="255" font-size="16" font-weight="normal" text-anchor="start">K-4</text>
<text x="663" y="255" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="550" y="262" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="262" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
