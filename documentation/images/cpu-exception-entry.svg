<svg xmlns="http://www.w3.org/2000/svg" width="2128" height="710" viewBox="0 0 2128 710" role="img" aria-labelledby="title desc">
<title id="title">CPU exception: abandon the faulting context and prepare a kernel handler</title>
<desc id="desc">The user-fault case is shown. BAF holds old CS, not a pointer, until a C prologue uses it. The temporary boundary helper saves and restores that value before it is used for the CS difference. No register frame or interrupt-return path is restored for the faulting context.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27617b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#192c38">
<text x="24" y="30" font-size="23" font-weight="bold" text-anchor="start">CPU exception: abandon the faulting context and prepare a kernel handler</text>
<text x="24" y="72" font-size="21" font-weight="bold" text-anchor="start">1. Preserve interrupted CS</text>
<path d="M 485 64 L 528 64" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="24" y="107" font-size="17" font-weight="bold" text-anchor="start">Kernel stack · higher addresses at top</text>
<rect x="24" y="122" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="122" width="347" height="28" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="143" font-size="16" font-weight="normal" text-anchor="start">K</text>
<text x="137" y="143" font-size="17" font-weight="normal" text-anchor="start">initial free cell</text>
<rect x="24" y="150" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="150" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="171" font-size="16" font-weight="normal" text-anchor="start">K-1</text>
<text x="137" y="171" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="178" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="178" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="199" font-size="16" font-weight="normal" text-anchor="start">K-2</text>
<text x="137" y="199" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="206" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="206" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="227" font-size="16" font-weight="normal" text-anchor="start">K-3</text>
<text x="137" y="227" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="234" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="234" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="255" font-size="16" font-weight="normal" text-anchor="start">K-4</text>
<text x="137" y="255" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="262" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="262" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="283" font-size="16" font-weight="normal" text-anchor="start">K-5</text>
<text x="137" y="283" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="290" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="290" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="311" font-size="16" font-weight="normal" text-anchor="start">K-6</text>
<text x="137" y="311" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="24" y="318" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="318" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="339" font-size="16" font-weight="normal" text-anchor="start">K-7</text>
<text x="137" y="339" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<text x="24" y="414" font-size="17" font-weight="bold" text-anchor="start">Faulting user-process stack · grows downward</text>
<rect x="24" y="429" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="429" width="347" height="28" fill="#eadffa" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="450" font-size="16" font-weight="normal" text-anchor="start">S0</text>
<text x="137" y="450" font-size="17" font-weight="normal" text-anchor="start">saved PC = faulting PC − 1</text>
<rect x="24" y="457" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="127" y="457" width="347" height="28" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="33" y="478" font-size="16" font-weight="normal" text-anchor="start">S0−1</text>
<text x="137" y="478" font-size="17" font-weight="normal" text-anchor="start">free after automatic entry</text>
<rect x="24" y="530" width="450" height="96" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="36" y="556" font-size="17" font-weight="normal" text-anchor="start">SP=S0−1; BAF=old CS (a value)</text>
<text x="36" y="578" font-size="17" font-weight="normal" text-anchor="start">Only PC was saved automatically</text>
<text x="36" y="600" font-size="17" font-weight="normal" text-anchor="start">No six-register resumable frame</text>
<text x="487" y="461" font-size="14" font-weight="normal" text-anchor="end">SP</text>
<path d="M 484 471 L 475 471" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="550" y="72" font-size="21" font-weight="bold" text-anchor="start">2. Select fresh kernel stack</text>
<path d="M 1011 64 L 1054 64" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="550" y="107" font-size="17" font-weight="bold" text-anchor="start">Kernel stack · higher addresses at top</text>
<rect x="550" y="122" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
