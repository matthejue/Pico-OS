<text x="663" y="283" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="550" y="290" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="290" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="311" font-size="16" font-weight="normal" text-anchor="start">K-6</text>
<text x="663" y="311" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<rect x="550" y="318" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="318" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="339" font-size="16" font-weight="normal" text-anchor="start">K-7</text>
<text x="663" y="339" font-size="17" font-weight="normal" text-anchor="start">not used by this entry</text>
<text x="550" y="414" font-size="17" font-weight="bold" text-anchor="start">Abandoned user-process stack · grows downward</text>
<rect x="550" y="429" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="429" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="450" font-size="16" font-weight="normal" text-anchor="start">S0</text>
<text x="663" y="450" font-size="17" font-weight="normal" text-anchor="start">saved PC = faulting PC − 1</text>
<rect x="550" y="457" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="457" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="478" font-size="16" font-weight="normal" text-anchor="start">S0−1</text>
<text x="663" y="478" font-size="17" font-weight="normal" text-anchor="start">free after automatic entry</text>
<rect x="550" y="530" width="450" height="96" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="562" y="556" font-size="17" font-weight="normal" text-anchor="start">IN1=0 → boundary=0; SP=K</text>
<text x="562" y="578" font-size="17" font-weight="normal" text-anchor="start">CS/DS=kernel; BAF still old CS</text>
<text x="562" y="600" font-size="17" font-weight="normal" text-anchor="start">The old stack is no longer used</text>
<text x="1013" y="126" font-size="14" font-weight="normal" text-anchor="end">SP</text>
<path d="M 1010 136 L 1001 136" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1076" y="72" font-size="21" font-weight="bold" text-anchor="start">3. Temporary boundary call</text>
<path d="M 1537 64 L 1580 64" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="1076" y="107" font-size="17" font-weight="bold" text-anchor="start">Kernel stack · higher addresses at top</text>
<rect x="1076" y="122" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="122" width="347" height="28" fill="#eadffa" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="143" font-size="16" font-weight="normal" text-anchor="start">K</text>
<text x="1189" y="143" font-size="17" font-weight="normal" text-anchor="start">boundary-call continuation</text>
<rect x="1076" y="150" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="150" width="347" height="28" fill="#fff1c7" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="171" font-size="16" font-weight="normal" text-anchor="start">K-1</text>
<text x="1189" y="171" font-size="17" font-weight="normal" text-anchor="start">saved caller BAF = old CS</text>
<rect x="1076" y="178" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="178" width="347" height="28" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="199" font-size="16" font-weight="normal" text-anchor="start">K-2</text>
<text x="1189" y="199" font-size="17" font-weight="normal" text-anchor="start">free at helper prologue ← BAF/SP</text>
<rect x="1076" y="206" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="206" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="227" font-size="16" font-weight="normal" text-anchor="start">…</text>
<text x="1189" y="227" font-size="17" font-weight="normal" text-anchor="start">nested calls / temporaries below</text>
<text x="1076" y="414" font-size="17" font-weight="bold" text-anchor="start">Abandoned user-process stack · grows downward</text>
<rect x="1076" y="429" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="429" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="450" font-size="16" font-weight="normal" text-anchor="start">S0</text>
<text x="1189" y="450" font-size="17" font-weight="normal" text-anchor="start">saved PC = faulting PC − 1</text>
<rect x="1076" y="457" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1179" y="457" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1085" y="478" font-size="16" font-weight="normal" text-anchor="start">S0−1</text>
<text x="1189" y="478" font-size="17" font-weight="normal" text-anchor="start">free after automatic entry</text>
<rect x="1076" y="530" width="450" height="96" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="1088" y="556" font-size="17" font-weight="normal" text-anchor="start">Prologue: BAF=SP=K−2; old CS at K−1</text>
<text x="1088" y="578" font-size="17" font-weight="normal" text-anchor="start">Nested calls then write kernel boundary</text>
<text x="1088" y="600" font-size="17" font-weight="normal" text-anchor="start">Epilogue: SP=K, BAF=old CS</text>
<text x="1539" y="182" font-size="14" font-weight="normal" text-anchor="end">BAF</text>
<path d="M 1536 192 L 1527 192" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1602" y="72" font-size="21" font-weight="bold" text-anchor="start">4. Enter exception C handler</text>
<text x="1602" y="107" font-size="17" font-weight="bold" text-anchor="start">Kernel stack · higher addresses at top</text>
<rect x="1602" y="122" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="122" width="347" height="28" fill="#fff1c7" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="143" font-size="16" font-weight="normal" text-anchor="start">K</text>
<text x="1715" y="143" font-size="17" font-weight="normal" text-anchor="start">old CS − kernel CS (argument)</text>
<rect x="1602" y="150" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="150" width="347" height="28" fill="#eadffa" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="171" font-size="16" font-weight="normal" text-anchor="start">K-1</text>
<text x="1715" y="171" font-size="17" font-weight="normal" text-anchor="start">0: unreachable return address</text>
<rect x="1602" y="178" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="178" width="347" height="28" fill="#fff1c7" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="199" font-size="16" font-weight="normal" text-anchor="start">K-2</text>
<text x="1715" y="199" font-size="17" font-weight="normal" text-anchor="start">saved caller BAF = old CS</text>
<rect x="1602" y="206" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="206" width="347" height="28" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="227" font-size="16" font-weight="normal" text-anchor="start">K-3</text>
<text x="1715" y="227" font-size="17" font-weight="normal" text-anchor="start">local cause ← BAF</text>
<rect x="1602" y="234" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="234" width="347" height="28" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="255" font-size="16" font-weight="normal" text-anchor="start">K-4</text>
<text x="1715" y="255" font-size="17" font-weight="normal" text-anchor="start">local kernel_exception</text>
<rect x="1602" y="262" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="262" width="347" height="28" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="283" font-size="16" font-weight="normal" text-anchor="start">K-5</text>
<text x="1715" y="283" font-size="17" font-weight="normal" text-anchor="start">free SP after reserving two locals</text>
<rect x="1602" y="290" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="290" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="311" font-size="16" font-weight="normal" text-anchor="start">…</text>
<text x="1715" y="311" font-size="17" font-weight="normal" text-anchor="start">expression temporaries and calls</text>
<text x="1602" y="414" font-size="17" font-weight="bold" text-anchor="start">Abandoned user-process stack · grows downward</text>
<rect x="1602" y="429" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="429" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="450" font-size="16" font-weight="normal" text-anchor="start">S0</text>
<text x="1715" y="450" font-size="17" font-weight="normal" text-anchor="start">saved PC = faulting PC − 1</text>
<rect x="1602" y="457" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="1705" y="457" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1611" y="478" font-size="16" font-weight="normal" text-anchor="start">S0−1</text>
<text x="1715" y="478" font-size="17" font-weight="normal" text-anchor="start">free after automatic entry</text>
<rect x="1602" y="530" width="450" height="96" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="1614" y="556" font-size="17" font-weight="normal" text-anchor="start">Difference is pushed before C uses BAF</text>
<text x="1614" y="578" font-size="17" font-weight="normal" text-anchor="start">C prologue: BAF=K−3; SP=K−5</text>
<text x="1614" y="600" font-size="17" font-weight="normal" text-anchor="start">Kernel panic or process exit → dispatcher</text>
<text x="2065" y="210" font-size="14" font-weight="normal" text-anchor="end">BAF</text>
<path d="M 2062 220 L 2053 220" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="24" y="690" font-size="17" font-weight="normal" text-anchor="start">Yellow: saved   Purple: PC   Blue: active registers   Gray: discarded   Solid arrows: transfers / execution   Dashed: pointers</text>
</g></svg>
