<rect x="550" y="150" width="103" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<rect x="653" y="150" width="347" height="28" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="559" y="171" font-size="16" font-weight="normal" text-anchor="start">K-1</text>
