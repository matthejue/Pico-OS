<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="title desc">
<title id="title">Steps 1–3: skip state STOPPED, select PCB 5, then dispatch</title>
<desc id="desc">The same five linked PCBs appear in each step. PCB 3 is initially current, with its context saved and its state set to READY by the dispatcher. The scheduler starts at PCB 4, skips its STOPPED state, and returns PCB 5 with state READY. Only the dispatcher changes active_process to PCB 5 and PCB 5&#x27;s state to RUNNING.</desc>
