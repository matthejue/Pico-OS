<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="712" viewBox="0 0 1400 712" role="img" aria-labelledby="title desc"><title id="title">0. Before load(): no child yet</title><desc id="desc">0. Before load(): no child yet. Each outlined group belongs to one process. Its PCB points to a separately allocated FileDescriptorTable, which points to one contiguous eight-entry array drawn as eight rows. Every non-NULL path points to a separate allocation displayed in full on its row, including stdin and stderr. FREE entries have path NULL and no path allocation. Quoted paths use C string literal notation with an implicit terminating null character. BH abbreviates BlockHeader. STDIN, STDOUT, STDERR, FILE and FREE abbreviate FILE_DESCRIPTOR constants. Pale amber rows 5–7 identify reserved backup slots even when FREE, and their allocated path strings use the same pale amber fill. Teal arrows follow stored pointers. Amber call arrows identify changed objects; amber outlines mark changed entries. Flags, offsets and unrelated allocations are omitted. Sizes and allocation positions are illustrative. The starting SRAM overview shows only the shell; no child exists yet. Only the shell&#x27;s allocations are expanded.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="32" width="55" height="66" fill="#f4f8f8" stroke