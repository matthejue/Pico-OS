<svg xmlns="http://www.w3.org/2000/svg" width="2109" height="832" viewBox="0 120 2109 832" role="img" aria-labelledby="title desc">
<title id="title">Global shared-memory list and entry names in SRAM</title>
<desc id="desc">Kernel .ivt, .text and .data form the Kernel Image. Only .data is outlined to mark the kernel globals containing the shared-memory list head. The global shared_memory_list_head in kernel .data points to Shared Memory Entry 1. SharedMemoryEntry.next links Entry 1 to Entry 2, whose next is NULL. Each entry and its copied name occupy separate Kernel Heap payloads. name points to the corresponding string, skipping allocator headers. Entry 1 has two attachments and Entry 2 has one. Both are named and unlink_requested is false. Below SRAM, the same two entry objects appear as a logical registry list with the same global head and next link. Dashed lines identify those objects across the two views. Allocator pointer arrows are omitted.</desc>
