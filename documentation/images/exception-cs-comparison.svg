<text x="44" y="390" font-size="20" font-weight="bold" text-anchor="start">A · MOVE BAF ACC</text>
<text x="44" y="423" font-size="18" font-weight="normal" text-anchor="start">ACC = interrupted CS</text>
<text x="420" y="390" font-size="20" font-weight="bold" text-anchor="start">B · SUB ACC CS</text>
<text x="420" y="423" font-size="18" font-weight="normal" text-anchor="start">ACC = interrupted CS − kernel CS</text>
<text x="796" y="390" font-size="20" font-weight="bold" text-anchor="start">C · PUSH ACC</text>
<text x="796" y="423" font-size="17" font-weight="normal" text-anchor="start">Kernel-stack argument = difference</text>
<rect x="1160" y="360" width="387" height="134" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="1471" y="390" font-size="20" font-weight="bold" text-anchor="end">D · handle_cpu_exception(</text>
<text x="1489" y="390" font-size="20" font-weight="bold" text-anchor="middle">diff</text>
<text x="1507" y="390" font-size="20" font-weight="bold" text-anchor="start">)</text>
<text x="1172" y="423" font-size="17" font-weight="normal" text-anchor="start">pushed ACC</text>
<path d="M 1280 417 L 1489 417 L 1489 397" fill="none" stroke="#637983" stroke-width="2"  marker-end="url(#value-arrow)"/>
<text x="1172" y="450" font-size="17" font-weight="normal" text-anchor="start">diff = 0 → kernel panic</text>
<text x="1172" y="472" font-size="17" font-weight="normal" text-anchor="start">diff ≠ 0 → process termination</text>
