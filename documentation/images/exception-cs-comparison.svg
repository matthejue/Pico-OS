<svg xmlns="http://www.w3.org/2000/svg" width="1579" height="518" viewBox="0 0 1579 518" role="img" aria-labelledby="title desc">
<title id="title">How exception entry compares interrupted CS with kernel CS</title>
<desc id="desc">Continuous SRAM in increasing offset order with the same kernel cells and grouping bands as the timer and Section 3 memory layouts. Kernel CS points to kernel .text. ProcessControlBlock.activation.cs points to .text inside Process Payload A, following its outer Block Header A. This example omits the optional process .ivt. Other process and shared-data blocks are omitted. Exception entry preserves interrupted CS in BAF, installs kernel CS, and pushes their difference for handle_cpu_exception. A gray value-transfer arrow points directly to diff, the abbreviated interrupted_kernel_cs_difference parameter. Zero selects kernel panic and a nonzero value selects process termination.</desc>
