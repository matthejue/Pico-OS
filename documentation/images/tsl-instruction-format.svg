<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
<title id="title">TSL DS ACC 2 instruction encoding</title><desc id="desc">Bits 31 to 30 are type 10, bits 29 to 28 mode 10, bits 27 to 25 source register DS 111, bits 24 to 22 destination register ACC 011, and bits 21 to 0 the signed immediate 2. The complete instruction is hexadecimal AEC00002.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#637983"/></marker></defs>
<g font-family="Cantarell, sans-serif" fill="#17313a">
<text x="51" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#17313a">31</text>
<text x="109" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#17313a">30</text>
<rect x="48" y="52" width="64" height="88" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="80.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">typ</text>
<text x="80.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">10</text>
<text x="80.0" y="171" font-size="13" text-anchor="middle" font-weight="normal" fill="#17313a">Store /</text>
<text x="80.0" y="188" font-size="13" text-anchor="middle" font-weight="normal" fill="#17313a">Move</text>
<text x="115" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#17313a">29</text>
<text x="173" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#17313a">28</text>
<rect x="112" y="52" width="64" height="88" fill="#fff1d6" stroke="#637983" stroke-width="2"/>
<text x="144.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">M</text>
<text x="144.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">10</text>
<text x="144.0" y="178" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">TSL</text>
<text x="179" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#17313a">27</text>
<text x="269" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#17313a">25</text>
<rect x="176" y="52" width="96" height="88" fill="#eaf5f5" stroke="#637983" stroke-width="2"/>
<text x="224.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">S</text>
<text x="224.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">111</text>
<text x="224.0" y="178" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">DS</text>
<text x="275" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#17313a">24</text>
<text x="365" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#17313a">22</text>
<rect x="272" y="52" width="96" height="88" fill="#e7f3ea" stroke="#637983" stroke-width="2"/>
<text x="320.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">D</text>
<text x="320.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">011</text>
<text x="320.0" y="178" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">ACC</text>
<text x="371" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#17313a">21</text>
<text x="1069" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#17313a">0</text>
<rect x="368" y="52" width="704" height="88" fill="#f4f8f8" stroke="#637983" stroke-width="2"/>
<text x="720.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">i</text>
<text x="720.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">0000000000000000000010</text>
<text x="720.0" y="178" font-size="18" text-anchor="middle" font-weight="normal" fill="#17313a">Signed offset +2</text>
<text x="560" y="227" font-size="24" text-anchor="middle" font-weight="bold" fill="#17313a">TSL DS ACC 2  →  0xAEC00002</text>
