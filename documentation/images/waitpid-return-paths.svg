<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="524" viewBox="0 0 1760 524" role="img" aria-labelledby="title desc"><title id="title">Waitpid execution steps and the corresponding SRAM changes</title><desc id="desc">Read numbered columns 1 through 5 from left to right. The top row shows successive execution on the same CPU. The lower row shows the corresponding SRAM changes, not another CPU. Step 1 is parent user code calling INT 0. Step 2 is kernel interrupt entry and wait handling. Immediate completion writes status and skips to step 5 through register restoration and RTI, possibly after rescheduling. A blocking wait saves PCB 1.activation, retains waiting_status_ptr, queues PCB 1 on PCB 2.waiters, and changes PCB 1.state to BLOCKED. Step 3 is execution of the child or other processes while the parent&#x27;s stack stays allocated. Step 4 is kernel notification of child termination or stopping: it writes through the retained pointer, clears that pointer and removes the parent from the queue, making PCB 1.state READY. When the parent is selected, the dispatcher restores activation and executes RTI. Step 5 resumes the parent after INT 0 with IN2 equal to 1 and waitpid returns stack-local status. This timeline assumes the parent itself is not stopped.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker></defs><g font-family="Cantarell, sans-serif"><path d="M 542 140 V 78 H 1554 V 140" fill="none" stroke="#637983" stroke-width="2.5" marker-end="url(#785099)"/><rect x="32" y="140" width="320" height="132" fill="#f4f8f8" stroke="#637983" stroke-width="2"/><text x="52" y="126" text-anchor="start" font-size="22" font-weight="bold" fill="#17313a">Step 1</text><a href="../../library/sys/wait/wait.picoc#L5"><text x="192" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Parent user code</text></a><a href="../../library/sys/wait/wait.picoc#L5"><text x="192" y="206" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waitpid → helper</text></a><a href="../../library/sys/wait/wait.picoc#L5"><text x="192" y="240" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">INT 0</text></a><path d="M 352 206 H 376" fill="none" stroke="#637983" stroke-width="2.5" marker-end="url(#785099)"/><path d="M 192 272 V 338" fill="none" stroke="#637983" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="376" y="140" width="320" height="132" fill="#f4f8f8" stroke="#637983" stroke-width="2"/><text x="396" y="126" text-anchor="start" font-size="22" font-weight="bold" fill="#17313a">Step 2</text><a href="../../kernel/process/process.picoc#L348"><text x="536" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Kernel code</text></a><a href="../../kernel/process/process.picoc#L348"><text x="536" y="206" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">syscall_interrupt</text></a><a href="../../kernel/process/process.picoc#L348"><text x="536" y="240" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">wait_for_process_by_pid</text></a><path d="M 696 206 H 720" fill="none" stroke="#637983" stroke-width="2.5" marker-end="url(#785099)"/><path d="M 536 272 V 338" fill="none" stroke="#637983" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="720" y="140" width="320" height="132" fill="#fff1d6" stroke="#637983" stroke-width="2"/><text x="740" y="126" text-anchor="start" font-size="22" font-weight="bold" fill="#17313a">Step 3</text><a href="../../kernel/dispatcher.picoc#L55"><text x="880" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Child / other user code</text></a><a href="../../kernel/dispatcher.picoc#L55"><text x="880" y="206" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">parent waits</text></a><a href="../../kernel/dispatcher.picoc#L55"><text x="880" y="240" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">CPU runs other processes</text></a><path d="M 1040 206 H 1064" fill="none" stroke="#637983" stroke-width="2.5" marker-end="url(#785099)"/><path d="M 880 272 V 338" fill="none" stroke="#637983" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="1064" y="140" width="320" height="132" fill="#f4f8f8" stroke="#637983" stroke-width="2"/><text x="1084" y="126" text-anchor="start" font-size="22" font-weight="bold" fill="#17313a">Step 4</text><a href="../../kernel/process/process.picoc#L261"><text x="1224" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Kernel code</text></a><a href="../../kernel/process/process.picoc#L261"><text x="1224" y="206" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">child stops / terminates</text></a><a href="../../kernel/process/process.picoc#L261"><text x="1224" y="240" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">notify waiting parent</text></a><path d="M 1384 206 H 1408" fill="none" stroke="#637983" stroke-width="2.5" marker-end="url(#785099)"/><path d="M 1224 272 V 338" fill="none" stroke="#637983" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="1408" y="140" width="320" height="132" fill="#e7f3ea" stroke="#637983" stroke-width="2"/><text x="1428" y="126" text-anchor="start" font-size="22" font-weight="bold" fill="#17313a">Step 5</text><a href="../../library/sys/wait/wait.picoc#L15"><text x="1568" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Parent user code</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="1568" y="206" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">helper resumes after INT 0</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="1568" y="240" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waitpid returns status</text></a><path d="M 1568 272 V 338" fill="none" stroke="#637983" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="32" y="338" width="320" height="166" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../library/sys/wait/wait.picoc#L16"><text x="192" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Parent stack</text></a><a href="../../common/syscall.header#L62"><text x="192" y="404" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">request.pid = child PID</text></a><a href="../../common/syscall.header#L63"><text x="192" y="438" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">request.status = &amp;status</text></a><a href="../../library/sys/wait/wait.picoc#L16"><text x="192" y="472" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">status = 0</text></a><rect x="376" y="338" width="320" height="166" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/dispatcher.picoc#L71"><text x="536" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Parent stack → PCB 1</text></a><a href="../../kernel/process/process.header#L40"><text x="536" y="404" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">save frame → activation</text></a><a href="../../kernel/process/process.header#L44"><text x="536" y="438" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">retain waiting_status_ptr</text></a><a href="../../kernel/process/process.header#L33"><text x="536" y="472" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">state = BLOCKED</text></a><rect x="720" y="338" width="320" height="166" fill="#fff1d6" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L46"><text x="880" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">PCB 2.waiters → PCB 1</text></a><a href="../../kernel/process/process.picoc#L375"><text x="880" y="404" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">parent stays queued</text></a><a href="../../library/sys/wait/wait.picoc#L16"><text x="880" y="438" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">parent stack stays allocated</text></a><a href="../../interrupt_service_routines/os_isrs.picoc#L121"><text x="880" y="472" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">saved IN2 = 1</text></a><rect x="1064" y="338" width="320" height="166" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L44"><text x="1224" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">PCB 1 → parent stack</text></a><a href="../../kernel/process/process.picoc#L261"><text x="1224" y="404" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">*waiting_status_ptr = result</text></a><a href="../../kernel/process/process.picoc#L395"><text x="1224" y="438" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">clear pointer, leave queue</text></a><a href="../../kernel/process/process.header#L33"><text x="1224" y="472" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">state = READY</text></a><rect x="1408" y="338" width="320" height="166" fill="#d8efef" stroke="#637983" stroke-width="1"/><a href="../../kernel/dispatcher.picoc#L21"><text x="1568" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Parent resumes</text></a><a href="../../kernel/process/process.header#L40"><text x="1568" y="404" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">saved registers → CPU</text></a><a href="../../kernel/dispatcher.picoc#L40"><text x="1568" y="438" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">RTI reads stack&#x27;s saved PC</text></a><a href="../../library/sys/wait/wait.picoc#L23"><text x="1568" y="472" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">waitpid reads status</text></a></g></svg>
