<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="590" viewBox="0 0 1480 590" role="img" aria-labelledby="title desc"><title id="title">Stack pointer and heap boundary protection</title><desc id="desc">Process stack protection in SRAM. Addresses increase from left to right. PCB 1 supplies base_address, heap_start and heap_size to process_stack_boundary, which computes B as the last heap cell. Periphery register 10 contains B and points to that cell. CPU register SP contains B + 1 and points to the next free stack cell, immediately below occupied cells starting at B + 2. The stack grows toward lower addresses. SUBI SP 2 proposes B - 1, below B, so the emulator rejects the instruction&#x27;s SP update, records stack-overflow cause 2 in periphery register 11 and enters cpu_exception_interrupt. The dashed arrow is a proposed address, not an updated SP. SP equal to B is allowed. Exception entry subsequently changes SP to save its PC, then the handler resets the kernel stack. A zero boundary disables protection. Memory widths are illustrative.</desc><defs><marker id="25734f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="805916" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker><marker id="637983" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="24" width="510" height="110" fill="#eaf3f4" stroke="#637983" stroke-width="1.5"/><a href="../../kernel/exception.picoc#L18"><text x="287" y="54" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">process_stack_boundary(PCB 1)</text></a><text x="52" y="88" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">B =</text><a href="../../kernel/process/process.header#L34"><text x="92" y="88" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">base_address</text></a><text x="230" y="88" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">+</text><a href="../../kernel/process/process.header#L36"><text x="253" y="88" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">heap_start</text></a><text x="370" y="88" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">+</text><a href="../../kernel/process/process.header#L37"><text x="92" y="117" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">heap_size</text></a><text x="203" y="117" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">− 1</text><rect x="610" y="24" width="470" height="110" fill="#eaf3f4" stroke="#637983" stroke-width="1.5"/><a href="../../kernel/exception.header#L5"><text x="845" y="57" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">STACK_HEAP_BOUNDARY_REGISTER</text></a><text x="845" y="89" text-anchor="middle" font-size="26" font-weight="bold" fill="#805916">B</text><text x="845" y="117" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">Periphery register 10</text><path d="M 542 79 H 610" fill="none" stroke="#637983" stroke-width="2" marker-end="url(#637983)"/><path d="M 845 134 V 160 H 512 V 250" fill="none" stroke="#805916" stroke-width="2" marker-end="url(#805916)"/><text x="492" y="191" text-anchor="end" font-size="20" font-weight="bold" fill="#805916">Boundary B</text><rect x="1110" y="24" width="338" height="110" fill="#e7f3ea" stroke="#637983" stroke-width="1.5"/><text x="1279" y="57" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">CPU register SP</text><text x="1279" y="95" text-anchor="middle" font-size="26" font-weight="bold" fill="#25734f">B + 1</text><path d="M 1279 134 V 177 H 662 V 250" fill="none" stroke="#25734f" stroke-width="2" marker-end="url(#25734f)"/><text x="32" y="228" text-anchor="start" font-size="20" font-weight="normal" fill="#17313a">Lower addresses</text><text x="1448" y="228" text-anchor="end" font-size="20" font-weight="normal" fill="#17313a">Higher addresses</text><text x="995" y="207" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">Stack grows</text><path d="M 1175 224 H 815" fill="none" stroke="#25734f" stroke-width="2" marker-end="url(#25734f)"/><rect x="32" y="250" width="300" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="182.0" y="282.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">…</text><text x="182.0" y="311.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">Heap cells</text><rect x="332" y="250" width="120" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="392.0" y="297.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">B − 1</text><rect x="452" y="250" width="120" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="512.0" y="297.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">B</text><rect x="572" y="250" width="180" height="106" fill="#e7f3ea" stroke="#637983" stroke-width="1.5"/><text x="662.0" y="282.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">B + 1</text><text x="662.0" y="311.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">Next free cell</text><rect x="752" y="250" width="180" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="842.0" y="282.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">B + 2</text><text x="842.0" y="311.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">Occupied</text><rect x="932" y="250" width="180" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="1022.0" y="282.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">B + 3</text><text x="1022.0" y="311.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">Occupied</text><rect x="1112" y="250" width="336" height="106" fill="#d8efef" stroke="#637983" stroke-width="1.5"/><text x="1280.0" y="282.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">…</text><text x="1280.0" y="311.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17313a">Occupied stack cells</text><rect x="452" y="250" width="120" height="106" fill="none" stroke="#805916" stroke-width="3"/><rect x="32" y="356" width="540" height="34" fill="#eaf3f4" stroke="#637983" stroke-width="1.5"/><text x="302" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">User Process Heap</text><rect x="572" y="356" width="876" height="34" fill="#f4f8f8" stroke="#637983" stroke-width="1.5"/><text x="1010" y="380" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">User Process Stack</text><path d="M 662 390 V 420 H 392 V 390" fill="none" stroke="#805916" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#805916)"/><text x="527" y="453" text-anchor="middle" font-size="20" font-weight="bold" fill="#805916">SUBI SP 2</text><text x="392" y="490" text-anchor="middle" font-size="20" font-weight="normal" fill="#805916">Proposed SP = B − 1</text><text x="392" y="518" text-anchor="middle" font-size="20" font-weight="bold" fill="#805916">Rejected by CPU</text><text x="392" y="557" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">SP = B is still allowed</text><rect x="780" y="432" width="668" height="132" fill="#eaf3f4" stroke="#637983" stroke-width="1.5"/><text x="1114" y="466" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">CPU check: new SP &lt; B → stack overflow</text><a href="../../kernel/exception.header#L6"><text x="1114" y="502" text-anchor="middle" font-size="19" font-weight="normal" fill="#17313a">CPU_EXCEPTION_CAUSE_REGISTER = 2</text></a><path d="M 1114 510 V 527" fill="none" stroke="#637983" stroke-width="2" marker-end="url(#637983)"/><a href="../../interrupt_service_routines/os_isrs.picoc#L161"><text x="1114" y="549" text-anchor="middle" font-size="20" font-weight="bold" fill="#17313a">cpu_exception_interrupt()</text></a></g></svg>
