ext-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Heap</text><rect x="1072" y="775" width="720" height="30" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="1432.0" y="796" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">User Process Stack</text><rect x="132" y="805" width="1660" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="962.0" y="826" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Process Payload B · one allocation for the new user process</text><path d="M 852.0 420 C 852.0 540, 197.0 540, 197.0 615" fill="none" stroke="#26715b" stroke-width="2" marker-end="url(#26715b)"/><rect x="466.1" y="519.375" width="116.80000000000001" height="22" fill="white" stroke="none" stroke-width="1"/><text x="524.5" y="535.375" text-anchor="middle" font-size="14" font-weight="normal" fill="#26715b">base_address</text><path d="M 1007.0 420 C 1007.0 560, 1432.0 560, 1432.0 615" fill="none" stroke="#405ea8" stroke-width="2" marker-end="url(#405ea8)"/><rect x="1236.0" y="534.375" width="268.0" height="22" fill="white" stroke="none" stroke-width="1"/><text x="1370" y="550.375" text-anchor="middle" font-size="14" font-weight="normal" fill="#405ea8">activation.sp / activation.baf</text><rect x="1137" y="250" width="210" height="170" fill="none" stroke="#9c3d15" stroke-width="3"/><rect x="1072" y="615" width="720" height="160" fill="none" stroke="#9c3d15" stroke-width="3"/><rect x="32" y="900" width="820" height="70" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="442.0" y="929.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Caller environment pointer array and strings</text><text x="442.0" y="950.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">heap-backed environ or an explicitly supplied array</text><rect x="32" y="900" width="820" height="70" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="972" y="900" 