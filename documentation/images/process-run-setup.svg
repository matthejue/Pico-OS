<svg xmlns="http://www.w3.org/2000/svg" width="1824" height="1040" viewBox="0 0 1824 1040" role="img" aria-labelledby="title desc"><title id="title">Run · inherit descriptors, build the initial stack, then set state to READY</title><desc id="desc">The same SRAM layout as the completed-load figure now highlights only the run effects: replace file_descriptors with an inherited independent table, write the initial User Process Stack, and change activation.sp, activation.baf and state. Arguments and environment are copied from the caller&#x27;s user memory. Globals process_list_head, process_list_tail and active_process do not change during run setup. entry_pc_address identifies the new entry PC cell; highest_stack_address identifies the final stack cell. Caller input buffers are shown separately below the child&#x27;s contiguous memory layout.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1824" height="1040" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="99" text-anchor="start" font-size="16" font-weight="normal" fill="#9c3d15">mark_process_ready_with_arguments(): descriptor copy → stack copy → state = READY</text><rect x="32" y="250" width="70" height="170" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="67.0" y="340.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.ivt</text><rect x="102" y="250" width="110" height="170" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="157.0" y="340.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.text</text><rect x="212" y="250" width="260" height="170" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="342.0" y="308.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">.data · kernel globals</text><text x="342.0" y="329.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">process_list_head = PCB 1</text><text x="342.0" y="350.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">process_list_tail = PCB 2</text><text x="342.0" y="371.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">active_process = PCB 1</text><rect x="472" y="250" width="65" height="170" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="504.5" y="329.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="504.5" y="350.5" text-anchor="middle" font-size="11.228813559322035" font-weight="normal" fill="#43576a">Header A</text><rect x="537" y="250" width="200" height="170" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="637.0" y="308.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload A · PCB 1</text><text x="637.0" y="329.5" text-anchor="middle" font-size="14.483821263482282" font-weight="normal" fill="#43576a">caller / previous tail</text><text x="637.0" y="350.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">next = PCB 2</text><text x="637.0" y="371.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">pending_load = NULL</text><rect x="737" y="250" width="65" height="170" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="769.5" y="329.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="769.5" y="350.5" text-anchor="middle" font-size="11