<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="866" viewBox="0 0 2460 866" role="img" aria-labelledby="title desc">
<title id="title">Startup sequence across the memory map</title>
<desc id="desc">Adjacent EPROM, periphery and SRAM bands show address order, with schematic widths. EPROM contains the bootloader. The periphery band contains UART and has no lifeline. SRAM is split into the kernel-reserved area, containing the kernel image, heap and stack, and the Process and Shared Data Heap, containing separate process payloads for init, shell and applications. Nine arrows follow loading and initialization from bootloader to kernel, init, shell and two applications. Dashed arrows show register setup and transfer of control.</desc>
<defs>
<marker id="load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17313a"/></marker>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17313a"/></marker>
</defs>
