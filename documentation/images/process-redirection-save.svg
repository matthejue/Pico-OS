<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="412" viewBox="0 0 1800 412" role="img" aria-labelledby="title desc"><title id="title">Open the output file and save shell stdout</title><desc id="desc">Only the expanded Kernel Heap is shown. The SRAM layout and emulator host remain as in the first snapshot. PCB 1 for the shell points to its FileDescriptorTable and its contiguous eight-entry array. Each object and each path string has its own BlockHeader. Only entries 1, 3 and 6 have their path allocations expanded. STDIN, STDOUT, STDERR, FILE and FREE abbreviate FILE_DESCRIPTOR constants. Amber outlines mark changed entries. Other allocations, flags and offsets are omitted. Teal arrows follow stored pointers. Amber call boxes and arrows identify the calls and the descriptor entries or tables they change. Each outlined group contains one process&#x27;s descriptors above and its copied paths below. The child&#x27;s pre-run table is omitted. Block letters and widths do not specify allocation order or sizes.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><rect width="1800" height="412" fill="white"/><g font-family="Cantarell, sans-serif"><rect x="32" y="32" width="1734" height="326" fill="none" stroke="#637983" stroke-width="1"/><a href="../../kernel/process/process.header#L42"><text x="52" y="58" text-anchor="start" font-size="18" font-weight="bold" 