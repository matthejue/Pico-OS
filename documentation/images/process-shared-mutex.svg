<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="610" viewBox="0 0 1560 610" role="img" aria-labelledby="title desc"><title id="title">Parent and two children share one counter and mutex</title><desc id="desc">The launcher creates the named shared-memory region, maps and initializes SharedState, then loads and runs two copies of worker.bin without arguments. Both workers open the same name with size 0 to obtain the existing ID. All three processes map the same ID, so their local shared_state pointers reach the same SharedState payload. The workers lock, increment workers, yield, and unlock. Each worker yields while holding the lock. The payload initially contains workers = 0, mutex.lock = false, and an empty mutex.waiters queue. One kernel SharedMemoryEntry stores the name shared-memory-mutex, the ID, and address of that payload. The parent waits for both children, then unlinks the name. Boxes show responsibilities, not physical memory placement.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="30" y="140" width="350" height="290" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../documentation/shared_mutex/launcher.picoc#L8"><text x="205" y="180" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">Parent · launcher</text></a><a href="../../library/sys/mman/mman.picoc#L16"><text x="205" y="227" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">shm_open(name, size)</text></a><a href="../../documentation/shared_mutex/launcher.picoc#L18"><text x="205" y="267" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">mmap(id) + initialize</text></a><a href="../../documentation/shared_mutex/launcher.picoc#L22"><text x="205" y="307" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">load + run both children</text></a><a href="../../library/sys/wait/wait.picoc#L15"><text x="205" y="347" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">waitpid for both children</text></a><a href="../../documentation/shared_mutex/launcher.picoc#L29"><text x="205" y="395" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">shm_unlink(name)</text></a><rect x="560" y="155" width="390" height="255" fill="#d8efef" stroke="#805916" stroke-width="2"/><text x="755" y="195" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">One shared region</text><a href="../../documentation/shared_mutex/shared.header#L5"><text x="755" y="231" text-anchor="middle" font-size="23" font-weight="bold" fill="#17313a">SharedState</text></a><rect x="575" y="244" width="360" height="45" fill="white" stroke="#637983" stroke-width="1"/><a href="../../documentation/shared_mutex/shared.header#L6"><text x="755" y="273" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">workers = 0</text></a><rect x="575" y="292" width="360" height="45" fill="white" stroke="#637983" stroke-width="1"/><a href="../../library/mutex/mutex.header#L7"><text x="755" y="321" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">mutex.lock = false</text></a><rect x="575" y="340" width="360" height="45" fill="white" stroke="#637983" stroke-width="1"/><a href="../../library/mutex/mutex.header#L8"><text x="755" y="369" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">mutex.waiters = empty queue</text></a><rect x="1150" y="60" width="380" height="185" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../documentation/shared_mutex/worker.picoc#L7"><text x="1340" y="97" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">Child 1 · worker</text></a><a href="../../documentation/shared_mutex/worker.picoc#L11"><text x="1340" y="134" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">shm_open(name, 0)</text></a><a href="../../library/sys/mman/mman.picoc#L24"><text x="1340" y="172" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">mmap(id)</text></a><a href="../../documentation/shared_mutex/worker.picoc#L13"><text x="1340" y="209" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">lock → increment → unlock</text></a><a href="../../documentation/shared_mutex/worker.picoc#L15"><text x="1340" y="234" text-anchor="middle" font-size="17" font-weight="normal" fill="#17313a">yield while holding the lock</text></a><rect x="1150" y="320" width="380" height="185" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../documentation/shared_mutex/worker.picoc#L7"><text x="1340" y="357" text-anchor="middle" font-size="25" font-weight="bold" fill="#17313a">Child 2 · worker</text></a><a href="../../documentation/shared_mutex/worker.picoc#L11"><text x="1340" y="394" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">shm_open(name, 0)</text></a><a href="../../library/sys/mman/mman.picoc#L24"><text x="1340" y="432" text-anchor="middle" font-size="22" font-weight="normal" fill="#17313a">mmap(id)</text></a><a href="../../documentation/shared_mutex/worker.picoc#L13"><text x="1340" y="469" text-anchor="middle" font-size="21" font-weight="normal" fill="#17313a">lock → increment → unlock</text></a><a href="../../documentation/shared_mutex/worker.picoc#L15"><text x="1340" y="494" text-anchor="middle" font-size="17" font-weight="normal" fill="#17313a">yield while holding the lock</text></a><path d="M 205 140 V 25 H 1100 V 97 H 1150" fill="none" stroke="#805916" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#9c3d15)"/><a href="../../documentation/shared_mutex/launcher.picoc#L24"><text x="660" y="18" text-anchor="middle" font-size="20" font-weight="normal" fill="#805916">load + run · no arguments</text></a><path d="M 205 430 V 580 H 1340 V 505" fill="none" stroke="#805916" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#9c3d15)"/><a href="../../documentation/shared_mutex/launcher.picoc#L25"><text x="660" y="572" text-anchor="middle" font-size="20" font-weight="normal" fill="#805916">load + run · no arguments</text></a><path d="M 380 267 H 560" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../documentation/shared_mutex/launcher.picoc#L12"><text x="470" y="251" text-anchor="middle" font-size="17" font-weight="normal" fill="#167b84">shared_state</text></a><path d="M 1150 172 H 1035 V 267 H 950" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../documentation/shared_mutex/worker.picoc#L9"><text x="1045" y="157" text-anchor="middle" font-size="17" font-weight="normal" fill="#167b84">shared_state</text></a><path d="M 1150 432 H 1035 V 369 H 950" fill="none" stroke="#167b84" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../documentation/shared_mutex/worker.picoc#L9"><text x="1045" y="455" text-anchor="middle" font-size="17" font-weight="normal" fill="#167b84">shared_state</text></a><rect x="560" y="465" width="390" height="80" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><a href="../../kernel/shared_memory.header#L8"><text x="755" y="492" text-anchor="middle" font-size="21" font-weight="bold" fill="#17313a">Kernel · SharedMemoryEntry</text></a><a href="../../kernel/shared_memory.header#L9"><text x="755" y="524" text-anchor="middle" font-size="18" font-weight="normal" fill="#17313a">name: &quot;shared-memory-mutex&quot; · id</text></a><path d="M 755 465 V 410" fill="none" stroke="#25734f" stroke-width="2.5" marker-end="url(#26715b)"/><a href="../../kernel/shared_memory.header#L11"><text x="803" y="445" text-anchor="middle" font-size="18" font-weight="normal" fill="#25734f">address</text></a></g></svg>
