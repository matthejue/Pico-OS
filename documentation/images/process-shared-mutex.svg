<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="610" viewBox="0 0 1560 610" role="img" aria-labelledby="title desc"><title id="title">Parent and two children share one counter and mutex</title><desc id="desc">The launcher creates the named shared-memory region, maps and initializes SharedState, then loads and runs two copies of worker.bin with arguments 1 &lt;id&gt; and 2 &lt;id&gt;. All three processes map the same ID, so their local shared_state pointers reach the same SharedState payload. The workers lock, increment workers, and unlock. Worker 1 also yields while holding the lock. The payload initially contains workers = 0, mutex.lock = false, and an empty mutex.waiters queue. One kernel SharedMemoryEntry stores the name shared-memory-mutex, the ID, and address of that payload. The parent waits for both children, reads the final count, and unlinks the name. Boxes show responsibilities, not physical memory placement.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1560" height="610" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="30" y="140" width="350" height="290" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../test/shared_memory_mutex/launcher.picoc#L35"><text x="205" y="180" text-anchor="middle" font-size="25" font-weight="bold" fill="#43576a">Parent · launcher</text></a><a href="../../library/sys/mman/mman.picoc#L15"><text x="205" y="227" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">shm_open(name, size)</text></a><a href="../../test/shared_memory_mutex/launcher.picoc#L47"><text x="205" y="267" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">mmap(id) + initialize</text></a><a href="../../test/shared_memory_mutex/launcher.picoc#L53"><text x="205" y="307" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">load + run both children</text></a><a href="../../library/sys/wait/wait.picoc#L14"><text x="205" y="347" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">waitpid for both children</text></a><a href="../../test/shared_memory_mutex/launcher.picoc#L60"><text x="205" y="395" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Read count + shm_unlink</text></a><rect x="560" y="155" width="390" height="255" fill="#deecff" stroke="#9c3d15" stroke-width="2"/><text x="755" y="195" text-anchor="middle" font-size="25" font-weight="bold" fill="#43576a">One shared region</text><a href="../../test/shared_memory_mutex/shared.header#L5"><text x="755" y="231" text-anchor="middle" font-size="23" font-weight="bold" fill="#43576a">SharedState</text></a><rect x="575" y="244" width="360" height="45" fill="white" stroke="#43576a" stroke-width="1"/><a href="../../test/shared_memory_mutex/shared.header#L6"><text x="755" y="273" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">workers = 0</text></a><rect x="575" y="292" width="360" height="45" fill="white" stroke="#43576a" stroke-width="1"/><a href="../../library/mutex/mutex.header#L7"><text x="755" y="321" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">mutex.lock = false</text></a><rect x="575" y="340" width="360" height="45" fill="white" stroke="#43576a" stroke-width="1"/><a href="../../library/mutex/mutex.header#L8"><text x="755" y="369" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">mutex.waiters = empty queue</text></a><rect x="1150" y="60" width="380" height="185" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../test/shared_memory_mutex/worker.picoc#L10"><text x="1340" y="97" text-anchor="middle" font-size="25" font-weight="bold" fill="#43576a">Child 1 · worker</text></a><a href="../../test/shared_memory_mutex/worker.picoc#L13"><text x="1340" y="134" text-anchor="middle" font-size="20" font-weight="normal" fill="#43576a">argv: worker.bin, 1, &lt;id&gt;</text></a><a href="../../library/sys/mman/mman.picoc#L23"><text x="1340" y="172" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">mmap(id)</text></a><a href="../../test/shared_memory_mutex/worker.picoc#L14"><text x="1340" y="209" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">lock → increment → unlock</text></a><a href="../../test/shared_memory_mutex/worker.picoc#L17"><text x="1340" y="234" text-anchor="middle" font-size="17" font-weight="normal" fill="#43576a">yield while holding the lock</text></a><rect x="1150" y="320" width="380" height="185" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../test/shared_memory_mutex/worker.picoc#L10"><text x="1340" y="357" text-anchor="middle" font-size="25" font-weight="bold" fill="#43576a">Child 2 · worker</text></a><a href="../../test/shared_memory_mutex/worker.picoc#L13"><text x="1340" y="394" text-anchor="middle" font-size="20" font-weight="normal" fill="#43576a">argv: worker.bin, 2, &lt;id&gt;</text></a><a href="../../library/sys/mman/mman.picoc#L23"><text x="1340" y="432" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">mmap(id)</text></a><a href="../../test/shared_memory_mutex/worker.picoc#L14"><text x="1340" y="469" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">lock → increment → unlock</text></a><path d="M 205 140 V 25 H 1100 V 97 H 1150" fill="none" stroke="#9c3d15" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#9c3d15)"/><a href="../../test/shared_memory_mutex/launcher.picoc#L55"><text x="660" y="18" text-anchor="middle" font-size="20" font-weight="normal" fill="#9c3d15">load + run · arguments: 1 &lt;id&gt;</text></a><path d="M 205 430 V 580 H 1340 V 505" fill="none" stroke="#9c3d15" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#9c3d15)"/><a href="../../test/shared_memory_mutex/launcher.picoc#L56"><text x="660" y="572" text-anchor="middle" font-size="20" font-weight="normal" fill="#9c3d15">load + run · arguments: 2 &lt;id&gt;</text></a><path d="M 380 267 H 560" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../test/shared_memory_mutex/launcher.picoc#L39"><text x="470" y="251" text-anchor="middle" font-size="17" font-weight="normal" fill="#405ea8">shared_state</text></a><path d="M 1150 172 H 1035 V 267 H 950" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../test/shared_memory_mutex/worker.picoc#L11"><text x="1045" y="157" text-anchor="middle" font-size="17" font-weight="normal" fill="#405ea8">shared_state</text></a><path d="M 1150 432 H 1035 V 369 H 950" fill="none" stroke="#405ea8" stroke-width="2.5" marker-end="url(#405ea8)"/><a href="../../test/shared_memory_mutex/worker.picoc#L11"><text x="1045" y="455" text-anchor="middle" font-size="17" font-weight="normal" fill="#405ea8">shared_state</text></a><rect x="560" y="465" width="390" height="80" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><a href="../../kernel/shared_memory.header#L8"><text x="755" y="492" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">Kernel · SharedMemoryEntry</text></a><a href="../../kernel/shared_memory.header#L9"><text x="755" y="524" text-anchor="middle" font-size="18" font-weight="normal" fill="#43576a">name: &quot;shared-memory-mutex&quot; · id</text></a><path d="M 755 465 V 410" fill="none" stroke="#26715b" stroke-width="2.5" marker-end="url(#26715b)"/><a href="../../kernel/shared_memory.header#L11"><text x="803" y="445" text-anchor="middle" font-size="18" font-weight="normal" fill="#26715b">address</text></a></g></svg>
