<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="590" viewBox="0 20 1840 590" role="img" aria-labelledby="title desc">
<title id="title">Restoring Process 1 among three processes: RTI returns the PC to its .text</title>
<desc id="desc">Three processes each have a process image containing optional .ivt, .text and .data, followed by a process heap and stack. The selected PCB 1 restores each CPU register from a separate activation field. SP points one cell below the return PC saved by the last hardware or software interrupt on Process 1's stack. RTI reads that saved PC, increments SP, and sets PC to the saved PC plus one. An arrow points to the resumed instruction inside Process 1's .text. Processes 2 and 3 retain their own memory layouts.</desc>
