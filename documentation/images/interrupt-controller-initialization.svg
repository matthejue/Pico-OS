<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800" role="img" aria-labelledby="title desc">
<title id="title">Interrupt-controller initialization in the RETI memory map</title>
<desc id="desc">EPROM, periphery and SRAM in address order. Individual entries of two int[3] arrays in kernel .data write the six controller registers. The kernel image contains .ivt, .text and .data, followed by kernel heap and stack. Process and shared data occupy the remaining heap.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Cantarell, sans-serif" fill="#17313a">
<text x="1455" y="38" font-size="21" font-weight="normal" text-anchor="start">Addresses →</text>
<rect x="24" y="90" width="205" height="690" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="36" y="125" font-size="23" font-weight="bold" text-anchor="start">EPROM</text>
<text x="36" y="160" font-size="18" font-weight="normal" text-anchor="start">0x00000000</text>
<text x="36" y="215" font-size="21" font-weight="normal" text-anchor="start">Bootloader</text>
<rect x="249" y="90" width="540" height="690" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="263" y="125" font-size="23" font-weight="bold" text-anchor="start">Periphery</text>
<text x="263" y="160" font-size="18" font-weight="normal" text-anchor="start">0x40000000</text>
<text x="267" y="215" font-size="22" font-weight="normal" text-anchor="start">…</text>
<text x="267" y="267" font-size="22" font-weight="bold" text-anchor="start">Controller registers</text>
<text x="275" y="329" font-size="21" font-weight="bold" text-anchor="start">ISR mapping</text>
<text x="275" y="493" font-size="21" font-weight="bold" text-anchor="start">Priority</text>
<text x="267" y="674" font-size="22" font-weight="normal" text-anchor="start">…</text>
<rect x="910" y="90" width="786" height="690" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="924" y="125" font-size="23" font-weight="bold" text-anchor="start">SRAM</text>
<text x="1470" y="125" font-size="18" font-weight="normal" text-anchor="start">0x80000000</text>
<rect x="924" y="143" width="758" height="580" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="938" y="174" font-size="22" font-weight="bold" text-anchor="start">Kernel</text>
