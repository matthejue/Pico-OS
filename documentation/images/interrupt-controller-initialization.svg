<rect x="950" y="229" width="240" height="42" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="962" y="255" font-size="21" font-weight="normal" text-anchor="start">.ivt</text>
<rect x="1190" y="229" width="466" height="42" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
<text x="1202" y="255" font-size="21" font-weight="normal" text-anchor="start">.text</text>
<rect x="950" y="281" width="706" height="353" fill="#ffffff" stroke="#637983" stroke-width="1.5"/>
