<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="660" viewBox="0 0 1640 660" role="img" aria-labelledby="title desc">
<title id="title">Interrupt-controller initialization in the RETI memory map</title>
<desc id="desc">EPROM, periphery and SRAM in address order. Two int[3] arrays in kernel .data write mapping cells 3-5 and priority cells 6-8. The separate function-pointer table occupies .ivt.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27617b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#192c38">
<text x="24" y="32" font-size="23" font-weight="bold" text-anchor="start">Interrupt-controller initialization: global arrays in SRAM → six periphery cells</text>
<text x="24" y="68" font-size="18" font-weight="normal" text-anchor="start">Increasing absolute addresses →   Layout widths are schematic</text>
<rect x="24" y="90" width="205" height="535" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="36" y="120" font-size="23" font-weight="bold" text-anchor="start">EPROM</text>
<text x="36" y="154" font-size="18" font-weight="normal" text-anchor="start">0x00000000</text>
<text x="36" y="177" font-size="18" font-weight="normal" text-anchor="start">… 0x3fffffff</text>
<text x="36" y="200" font-size="18" font-weight="normal" text-anchor="start"></text>
<text x="36" y="223" font-size="18" font-weight="normal" text-anchor="start">Bootloader</text>
<rect x="249" y="90" width="530" height="535" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="263" y="120" font-size="20" font-weight="bold" text-anchor="start">Periphery · 0x40000000 … 0x7fffffff</text>
<text x="267" y="161" font-size="18" font-weight="normal" text-anchor="start">… UART cells 0–2 …</text>
<rect x="264" y="188" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="219" font-size="18" font-weight="normal" text-anchor="start">0x40000003   timer mapping = 1</text>
<rect x="264" y="237" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="268" font-size="18" font-weight="normal" text-anchor="start">0x40000004   DMA/custom mapping = 4</text>
<rect x="264" y="286" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="317" font-size="18" font-weight="normal" text-anchor="start">0x40000005   UART mapping = 2</text>
<rect x="264" y="335" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="366" font-size="18" font-weight="normal" text-anchor="start">0x40000006   timer priority = 1</text>
<rect x="264" y="384" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="415" font-size="18" font-weight="normal" text-anchor="start">0x40000007   DMA/custom priority = 1</text>
<rect x="264" y="433" width="480" height="49" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="275" y="464" font-size="18" font-weight="normal" text-anchor="start">0x40000008   UART priority = 2</text>
<text x="267" y="524" font-size="18" font-weight="normal" text-anchor="start">… timer, boundary, exception, DMA …</text>
<text x="267" y="570" font-size="17" font-weight="normal" text-anchor="start">255 disables a device mapping.</text>
<text x="267" y="592" font-size="17" font-weight="normal" text-anchor="start">Initialization writes 255/0 before assignment.</text>
<rect x="850" y="90" width="766" height="535" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="867" y="120" font-size="21" font-weight="bold" text-anchor="start">SRAM · 0x80000000 … 0xffffffff</text>
<rect x="868" y="143" width="728" height="343" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="880" y="171" font-size="20" font-weight="bold" text-anchor="start">Kernel region</text>
<rect x="884" y="185" width="694" height="220" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="896" y="213" font-size="19" font-weight="bold" text-anchor="start">Kernel image</text>
<rect x="896" y="230" width="174" height="152" fill="#eadffa" stroke="#526472" stroke-width="1.5"/>
<text x="908" y="256" font-size="17" font-weight="normal" text-anchor="start">.ivt</text>
<text x="908" y="278" font-size="17" font-weight="normal" text-anchor="start">function pointers</text>
<text x="908" y="300" font-size="17" font-weight="normal" text-anchor="start">[5]</text>
<rect x="1070" y="230" width="123" height="152" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1082" y="256" font-size="17" font-weight="normal" text-anchor="start">.text</text>
<text x="1082" y="278" font-size="17" font-weight="normal" text-anchor="start">ISRs + C</text>
<rect x="1193" y="230" width="371" height="152" fill="#fff1c7" stroke="#526472" stroke-width="1.5"/>
<text x="1205" y="256" font-size="17" font-weight="normal" text-anchor="start">.data · global int[3] arrays</text>
<text x="1204" y="300" font-size="17" font-weight="normal" text-anchor="start">interrupt_device_isrs</text>
<text x="1204" y="322" font-size="17" font-weight="normal" text-anchor="start">[1, 4, 2]</text>
<text x="1204" y="344" font-size="17" font-weight="normal" text-anchor="start">interrupt_device_priorities</text>
<text x="1204" y="366" font-size="17" font-weight="normal" text-anchor="start">[1, 1, 2]</text>
<rect x="884" y="417" width="345" height="52" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="896" y="443" font-size="18" font-weight="normal" text-anchor="start">Kernel heap</text>
<rect x="1229" y="417" width="349" height="52" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="1241" y="443" font-size="18" font-weight="normal" text-anchor="start">Kernel stack</text>
<rect x="868" y="506" width="728" height="100" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="880" y="532" font-size="18" font-weight="normal" text-anchor="start">Process and Shared Data Heap</text>
<text x="880" y="555" font-size="18" font-weight="normal" text-anchor="start">Process images (each .text/.data/heap/stack) + shared data</text>
