<path d="M 820 262 L 746 262" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 820 311 L 746 311" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 1193 362 L 1180 362 L 1180 410 L 795 410 L 795 360 L 746 360" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 795 409 L 746 409" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M 795 410 L 795 458 L 746 458" fill="none" stroke="#27617b" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="863" y="645" font-size="16" font-weight="normal" text-anchor="start">interrupt_controller_initialize writes the mapping and priority cells</text>
</g></svg>
