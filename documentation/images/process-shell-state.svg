<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="610" viewBox="0 0 1800 610" role="img" aria-labelledby="title desc"><title id="title">Shell-owned state in SRAM</title><desc id="desc">Continuous SRAM contains the Kernel Image, Kernel Heap, Kernel Stack, and Process and Shared Data Heap. The global terminal input buffer is embedded in kernel .data. PCB 1 manages the shell. Its file_descriptors pointer reaches a separately allocated FileDescriptorTable, whose entries pointer reaches an eight-element array. PCB and descriptor path strings occupy other Kernel Heap blocks. PCB 1.base_address reaches the shell Process Payload after its outer Block Header A. The lower view expands that payload into .text, .data, User Process Heap and User Process Stack. All shell globals are stored inline in .data, together with linked-library globals process_heap and environ. process_heap.first_block reaches the inner allocator header, while environ reaches the environment pointer array, whose entries reach separately allocated strings. Only two example user-heap blocks are shown. The stack holds command[80], call-frame locals such as expanded_arguments[80], and startup arguments and environment. No shell input, history or pipeline array is a malloc allocation. Indices and counts are integers, not pointers. Other processes and allocations are omitted, and header letters do not fix allocation order.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" 