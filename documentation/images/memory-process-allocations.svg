<svg xmlns="http://www.w3.org/2000/svg" width="2629" height="611" viewBox="0 0 2629 611" role="img" aria-labelledby="title desc">
<title id="title">PCBs manage Process Payloads in the outer heap</title>
<desc id="desc">PCB 1 and PCB 2 are separate Kernel Heap payloads linked by ProcessControlBlock.next. Their base_address fields point to Process Payload A and Process Payload C. process_shared_data_heap is in kernel .data and first_block points to outer Block Header A.</desc>
