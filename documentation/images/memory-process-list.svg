<svg xmlns="http://www.w3.org/2000/svg" width="2039" height="773" viewBox="0 145 2039 773" role="img" aria-labelledby="title desc">
<title id="title">Global process list within SRAM</title>
<desc id="desc">Kernel .ivt, .text and .data form the Kernel Image, followed by the Kernel Heap and Kernel Stack. The Process and Shared Data Heap follows the Kernel area. Global process_list_head, process_list_tail and active_process point to PCB 1, PCB 3 and PCB 2. Four schematic neighboring Kernel Heap blocks contain PCB 1, its working_directory string, PCB 2 and PCB 3. Above SRAM, ProcessControlBlock.next links PCB 1, PCB 2, PCB 3, NULL, skipping the directory allocation. The working_directory arrow also stays above SRAM. Below SRAM, the same three PCB objects appear as a logical process list. process_list_head reaches PCB 1, process_list_tail reaches PCB 3, and active_process reaches PCB 2 in both views. PCB next links connect 1 to 2 to 3 to NULL. Dashed lines identify the same PCB objects across the two views. Allocator pointer arrows are omitted.</desc>
