<svg xmlns="http://www.w3.org/2000/svg" width="2039" height="670" viewBox="0 0 2039 670" role="img" aria-labelledby="title desc">
<title id="title">Global process list within SRAM</title>
<desc id="desc">Kernel .ivt, .text and .data form the Kernel Image, followed by the Kernel Heap and Kernel Stack. The Process and Shared Data Heap follows the Kernel area. Global process_list_head, process_list_tail and active_process point to heap-allocated PCBs. Four schematic neighboring blocks contain PCB 1, its working_directory string, PCB 2 and PCB 3. BlockHeader.next links A, B, C, D, NULL. ProcessControlBlock.next links PCB 1, PCB 2, PCB 3, NULL, skipping the directory allocation.</desc>
