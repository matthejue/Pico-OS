<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="340" viewBox="0 0 1640 340" role="img" aria-labelledby="title desc">
<title id="title">Why the timer compares the saved PC with kernel DS</title>
<desc id="desc">The kernel .text lies before .data and its DS boundary. User process .text lies in the Process and Shared Data Heap above the kernel region.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#27617b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#192c38">
<text x="24" y="32" font-size="23" font-weight="bold" text-anchor="start">Timer classification: kernel execution below kernel DS, user processes above it</text>
<text x="24" y="66" font-size="18" font-weight="normal" text-anchor="start">SRAM offsets increase left to right · widths are schematic</text>
<rect x="24" y="86" width="1125" height="170" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="36" y="113" font-size="20" font-weight="bold" text-anchor="start">Kernel region</text>
<rect x="40" y="127" width="660" height="113" fill="#ffffff" stroke="#526472" stroke-width="1.5"/>
<text x="52" y="153" font-size="18" font-weight="bold" text-anchor="start">Kernel image</text>
<rect x="52" y="164" width="85" height="62" fill="#eadffa" stroke="#526472" stroke-width="1.5"/>
<text x="64" y="190" font-size="17" font-weight="normal" text-anchor="start">.ivt</text>
<text x="64" y="212" font-size="17" font-weight="normal" text-anchor="start">0–4</text>
<rect x="137" y="164" width="279" height="62" fill="#dceefa" stroke="#526472" stroke-width="1.5"/>
<text x="149" y="190" font-size="17" font-weight="normal" text-anchor="start">.text · kernel code</text>
<text x="149" y="212" font-size="17" font-weight="normal" text-anchor="start">5–40765</text>
<rect x="416" y="164" width="269" height="62" fill="#fff1c7" stroke="#526472" stroke-width="1.5"/>
<text x="428" y="190" font-size="17" font-weight="normal" text-anchor="start">.data · kernel globals</text>
<text x="428" y="212" font-size="17" font-weight="normal" text-anchor="start">40766–41496</text>
<rect x="716" y="127" width="208" height="113" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="728" y="153" font-size="17" font-weight="normal" text-anchor="start">Kernel heap</text>
<text x="728" y="175" font-size="17" font-weight="normal" text-anchor="start">41497–45592</text>
<rect x="924" y="127" width="208" height="113" fill="#e6efe5" stroke="#526472" stroke-width="1.5"/>
<text x="936" y="153" font-size="17" font-weight="normal" text-anchor="start">Kernel stack</text>
<text x="936" y="175" font-size="17" font-weight="normal" text-anchor="start">45593–48308</text>
<rect x="1165" y="86" width="450" height="170" fill="#f1f3f5" stroke="#526472" stroke-width="1.5"/>
<text x="1177" y="112" font-size="18" font-weight="normal" text-anchor="start">Process and Shared Data Heap</text>
<text x="1177" y="135" font-size="18" font-weight="normal" text-anchor="start">48309–262143</text>
<text x="1177" y="158" font-size="18" font-weight="normal" text-anchor="start"></text>
<text x="1177" y="181" font-size="18" font-weight="normal" text-anchor="start">Process .text (normal user PCs)</text>
<text x="1177" y="204" font-size="18" font-weight="normal" text-anchor="start">Shared-data payloads</text>
<path d="M 416 296 L 416 228" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="428" y="283" font-size="18" font-weight="bold" text-anchor="start">kernel DS = 0x80009f3e</text>
<text x="24" y="323" font-size="19" font-weight="bold" text-anchor="start">saved PC &lt; kernel DS → kernel execution</text>
<text x="910" y="323" font-size="19" font-weight="bold" text-anchor="start">saved PC &gt; kernel DS → user process</text>
</g></svg>
