<svg xmlns="http://www.w3.org/2000/svg" width="1879" height="611" viewBox="0 0 1879 611" role="img" aria-labelledby="title desc">
<title id="title">Per-process User Process Heap</title>
<desc id="desc">An outer header is followed by one Process Payload. Only optional .ivt, .text and .data belong to the User Process Image. The User Process Heap and User Process Stack follow it. process_heap is a global in process .data and its first_block points to an inner heap header.</desc>
