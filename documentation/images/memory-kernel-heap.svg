<title id="title">Kernel Heap blocks and concrete kernel objects</title>
<desc id="desc">kernel_heap is in kernel .data and first_block points to Block Header A in the Kernel Heap. The illustrative payloads are a ProcessControlBlock, its copied binary_path, a SharedMemoryEntry and a free block. These are separate kmalloc allocations.</desc>
