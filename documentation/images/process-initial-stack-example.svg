<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="730" viewBox="0 0 1264 730" role="img" aria-labelledby="title desc"><title id="title">Concrete initial stack · add.bin · two arguments · two environment variables</title><desc id="desc">Every box is one 32-bit RETI cell, labeled by its offset from entry_pc_address, which is base_address plus size minus 29. The first nine cells contain the entry PC, argc, three argument pointers and NULL, two environment pointers and NULL. Higher cells contain add.bin, 2, 3, X=1 and Y=0 with a zero cell after every string. argv is entry_pc_address + 2 and envp is entry_pc_address + 6. Pointer targets are shown as offsets 9, 17, 19, 21 and 25, but stored pointers are absolute addresses: entry_pc_address plus that offset. The saved stack pointer is entry_pc_address minus one and the saved frame pointer is entry_pc_address minus two. Read rows in order, with increasing addresses to the right and stack growth to the left. Continuation arrows connect cell offsets 8 to 9 and 16 to 17. All cells belong to the same contiguous stack.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1264" height="730" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="32" text-anchor="start" font-size="23" font-weight="bold" fill="#43576a">Concrete initial stack · add.bin · two arguments · two environment variables</text><text x="32" y="61" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Lower addresses → higher addresses · widths are illustrative</text><text x="32" y="92" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Stack grows ← toward decreasing addresses · read rows in order · every box is one 32-bit cell</text><text x="32" y="115" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Cell address = entry_pc_address + offset · pointer targets show offsets; stored pointers are absolute addresses</text><rect x="32" y="145" width="100" height="90" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="82.0" y="174.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 0</text><text x="82.0" y="195.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">entry PC</text><text x="82.0" y="216.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">cs − 1</text><rect x="132" y="145" width="100" height="90" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="182.0" y="174.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 1</text><text x="182.0" y="195.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">argc</text><text x="182.0" y="216.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">3</text><rect x="232" y="145" width="100" height="90" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="282.0" y="174.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 2</text><text x="282.0" y="195.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">argv[0]</text><text x="282.0" y="216.0" text-anchor="middle" font-size="14.915254237288137" font-weight="normal" fill="#43576a">→ offset 9</text><rect x="332" y="145" width="100" height="90" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="382.0" y="174.0" text-ancho