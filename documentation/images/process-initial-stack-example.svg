<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="640" viewBox="0 0 1264 640" role="img" aria-labelledby="title desc"><title id="title">Concrete initial stack · add.bin · two arguments · two environment variables</title><desc id="desc">Every box is one 32-bit RETI cell. E is base_address plus size minus 29. The first nine cells contain the entry PC, argc, three argument pointers and NULL, two environment pointers and NULL. Higher cells contain add.bin, 2, 3, X=1 and Y=0 with a zero cell after every string. argv is E+2 and envp is E+6. Their pointers address E+9, E+17, E+19, E+21 and E+25 respectively. SP is E-1 and BAF is E-2. Read rows in order, with increasing addresses to the right and stack growth to the left. Continuation arrows connect E+8 to E+9 and E+16 to E+17. All cells belong to the same contiguous stack.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1264" height="640" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="32" text-anchor="start" font-size="23" font-weight="bold" fill="#43576a">Concrete initial stack · add.bin · two arguments · two environment variables</text><text x="32" y="61" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Lower addresses → higher addresses · widths are illustrative</text><text x="32" y="92" text-anchor="start" font-size="16" font-weight="normal" f