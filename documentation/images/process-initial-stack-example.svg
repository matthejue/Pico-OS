<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="516" viewBox="0 0 1264 516" role="img" aria-labelledby="title desc"><title id="title">Concrete initial stack · add.bin · two arguments · two environment variables</title><desc id="desc">Every box is one 32-bit RETI cell, labeled by its offset from entry_pc_address, which is base_address plus size minus 29. The first nine cells contain the entry PC, argc, three argument pointers and NULL, two environment pointers and NULL. Higher cells contain add.bin, 2, 3, X=1 and Y=0 with a zero cell after every string. argv is entry_pc_address + 2 and envp is entry_pc_address + 6. Pointer targets are shown as offsets 9, 17, 19, 21 and 25, but stored pointers are absolute addresses: entry_pc_address plus that offset. Read rows in order, with increasing addresses to the right and stack growth to the left. Continuation arrows connect cell offsets 8 to 9 and 16 to 17. All cells belong to the same contiguous stack.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="32" width="100" height="90" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="82.0" y="61.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">offset 0</text><text x="82.0" y="82.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#17313a">entry PC</text><text x="