xt-anchor="middle" font-size="13.559322033898306" font-weight="normal" fill="#43576a">→ offset 25</text><rect x="832" y="145" width="100" height="90" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="882.0" y="174.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 8</text><text x="882.0" y="195.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">envp[2]</text><text x="882.0" y="216.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">NULL = 0</text><rect x="32" y="145" width="900" height="90" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="232" y="235" width="400" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="432.0" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">argv = entry_pc_address + 2</text><rect x="632" y="235" width="300" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="782.0" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">envp = entry_pc_address + 6</text><text x="32" y="310" text-anchor="start" font-size="16" font-weight="bold" fill="#43576a">Copied executable path · strings_start_address = entry_pc_address + 9</text><rect x="32" y="325" width="100" height="72" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="82.0" y="355.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 9</text><text x="82.0" y="376.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">&#x27;a&#x27; = 97</text><rect x="132" y="325" width="100" height="72" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="182.0" y="355.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 10</text><text x="182.0" y="376.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">&#x27;d&#x27; = 100</text><rect x="232" y="325" width="100" height="72" fill="#deecff" stroke="#43576a" stroke-width="1"/><