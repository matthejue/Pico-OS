><rect x="1132" y="487" width="100" height="72" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1182.0" y="517.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">offset 28</text><text x="1182.0" y="538.5" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">&#x27;\0&#x27; = 0</text><rect x="32" y="487" width="1200" height="72" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="32" y="559" width="200" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="132.0" y="580" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">argv[1] → &quot;2\0&quot;</text><rect x="232" y="559" width="200" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="332.0" y="580" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">argv[2] → &quot;3\0&quot;</text><rect x="432" y="559" width="400" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="632.0" y="580" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">envp[0] → &quot;X=1\0&quot;</text><rect x="832" y="559" width="400" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1032.0" y="580" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">envp[1] → &quot;Y=0\0&quot;</text><path d="M 932 190.0 H 944 Q 956 190.0 956 202.0 V 279 Q 956 291 944 291 H 24 Q 12 291 12 303 V 349.0 Q 12 361.0 24 361.0 H 32" fill="none" stroke="#9c3d15" stroke-width="3" marker-end="url(#9c3d15)"/><text x="484.0" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c3d15">Next memory cell: offset 8 → offset 9</text><path d="M 832 361.0 H 844 Q 856 361.0 856 373.0 V 441 Q 856 453 844 453 H 24 Q 12 453 12 465 V 511.0 Q 12 523.0 24 523.0 H 32" fill="none" stroke="#9c3d15" stroke-width="3" marker-end="url(#9c3d15)"/><text x="434.0" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c3d15">Next memory cell: offset 16 → offset 17</text><text x="32" y="630" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">startup_cell_count = 29 · entry_pc_address = base_address + size − startup_cell_count</text><text x="32" y="655" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">highest_stack_address = entry_pc_address + 28 · final string terminator at offset 28</text><text x="32" y="680" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Saved stack pointer (SP) = entry_pc_address − 1 · saved frame pointer (BAF) = entry_pc_address − 2</text></g></svg>
