<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="458" viewBox="0 0 1060 458" role="img" aria-labelledby="title desc"><title id="title">Child stack after load · one preliminary entry-PC cell</title><desc id="desc">After a successful load, the child is NEW. Only the highest reserved stack cell, highest_stack_address = base_address + size - 1, is initialized to activation.cs - 1. Like the run stack table, the stack is drawn vertically with lower addresses at the top and higher addresses at the bottom. Direct arrows from the saved PCB registers show activation.baf pointing to that initialized cell and activation.sp pointing to the uninitialized cell immediately above it. Each of the bottom two stack boxes is one 32-bit cell; the top box represents all remaining reserved stack cells. Stack growth goes upward toward lower addresses. Arguments and environment are built later by run.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1060" height="458" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="24" y="228" width="250" height="54" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="149" y="262" text-anchor="middle" font-size="20" font-weight="bold" fill="#405ea8">activation.sp</text><path d="M 274 255 H 340" fill="none" stroke="#405ea8" stroke-width="2" marker-end="url(#405ea8)"/><rect x="24" y="328" width="250" height="54" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="149" y="362" text-anchor="middle" font-size="20" font-weight="bold" fill="#785099">activation.baf</text><path d="M 274 355 H 340" fill="none" stroke="#785099" stroke-width="2" marker-end="url(#785099)"/><rect x="340" y="55" width="360" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><rect x="340" y="205" width="360" height="100" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><rect x="340" y="305" width="360" height="100" fill="#deecff" stroke="#43576a" stroke-width="1"/><rect x="340" y="305" width="360" height="100" fill="none" stroke="#9c3d15" stroke-width="3"/><text x="520" y="118" text-anchor="middle" font-size="21" font-weight="bold" fill="#43576a">Remaining cells</text><text x="520" y="150" text-anchor="middle" font-size="21" font-weight="normal" fill="#43576a">Uninitialized</text><text x="520" y="261" text-anchor="middle" font-size="22" font-weight="normal" fill="#43576a">Uninitialized</text><text x="520" y="361" text-anchor="middle" font-size="22" font-weight="bold" fill="#43576a">activation.cs − 1</text><text x="520" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#43576a">↑ Lower addresses</text><text x="520" y="438" text-anchor="middle" font-size="20" font-weight="bold" fill="#43576a">↓ Higher addresses</text><text x="724" y="261" text-anchor="start" font-size="20" font-weight="normal" fill="#43576a">highest_stack_address − 1</text><text x="724" y="361" text-anchor="start" font-size="20" font-weight="normal" fill="#43576a">highest_stack_address</text><path d="M 742 176 V 87" fill="none" stroke="#26715b" stroke-width="2" marker-end="url(#26715b)"/><text x="762" y="137" text-anchor="start" font-size="18" font-weight="normal" fill="#26715b">Stack grows</text></g></svg>
