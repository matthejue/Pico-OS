<svg xmlns="http://www.w3.org/2000/svg" width="2274" height="530" viewBox="0 0 2274 530" role="img" aria-labelledby="title desc"><title id="title">Parent-derived state · copies at load completion and at run setup</title><desc id="desc">The complete SRAM map shows a compact Kernel Image, a detailed Kernel Heap, a compact Kernel Stack, and the Process and Shared Data Heap as one compact region. The schematic contiguous Kernel Heap contains separate allocator blocks for parent and child PCBs, parent and child working-directory strings, and independent parent and child descriptor tables. Solid curved arrows are stored pointer fields. Dashed arrows mark copying operations, rather than shared pointers. parent_pid and parent_death_signal are copied integer values during creation.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167b84"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25734f"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637983"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#805916"/></marker></defs><g font-family="Cantarell, sans-serif"><rect x="32" y="150" width="150" height="150" fill="#f4f8f8" stroke="#637983" stroke-width="1"/><text x="107.0" y="230.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">Kernel Image</text><rect x="182" y="150" width="60" height="150" fill="#eaf3f4" stroke="#637983" stroke-width="1"/><a href="../../common/heap.header#L5"><text x="212.0" y="219.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#17313a">Block</text></a><a href="../../common/heap.header#L5"><text x="212.0"