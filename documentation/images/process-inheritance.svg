<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="720" viewBox="0 0 1760 720" role="img" aria-labelledby="title desc"><title id="title">Parent-derived state · copies at load completion and at run setup</title><desc id="desc">A schematic contiguous Kernel Heap contains separate allocator blocks for parent and child PCBs, parent and child working-directory strings, and independent parent and child descriptor tables. Solid curved arrows are stored pointer fields. Dashed arrows mark copying operations, rather than shared pointers. parent_pid and parent_death_signal are copied integer values during creation.</desc><defs><marker id="405ea8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405ea8"/></marker><marker id="26715b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#26715b"/></marker><marker id="785099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#785099"/></marker><marker id="9c3d15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c3d15"/></marker></defs><rect width="1760" height="720" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="100" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Load completion: child.parent_pid = parent.pid · child.parent_death_signal = parent.parent_death_signal</text><rect x="32" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="62.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="62.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header A</text><rect x="92" y="280" width="290" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="237.0" y="318.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload A · PCB 1</text><text x="237.0" y="339.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">parent / usual caller</text><text x="237.0" y="360.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">pid · parent_death_signal</text><text x="237.0" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">working_directory</text><text x="237.0" y="402.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">file_descriptors</text><rect x="382" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="412.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="412.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header B</text><rect x="442" y="280" width="290" height="150" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="587.0" y="318.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload B · PCB 2</text><text x="587.0" y="339.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">new child</text><text x="587.0" y="360.0" text-anchor="middle" font-size="14.724576271186441" font-weight="normal" fill="#43576a">parent_pid · parent_death_signal</text><text x="587.0" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">working_directory</text><text x="587.0" y="402.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">file_descriptors</text><rect x="732" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="762.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="762.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header C</text><rect x="792" y="280" width="185" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="884.5" y="339.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload C</text><text x="884.5" y="360.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">parent directory</text><text x="884.5" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">&quot;/user&quot;</text><rect x="977" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="1007.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="1007.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header D</text><rect x="1037" y="280" width="185" height="150" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="1129.5" y="339.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload D</text><text x="1129.5" y="360.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">child directory</text><text x="1129.5" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">&quot;/user&quot; copy</text><rect x="1222" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="1252.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="1252.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header E</text><rect x="1282" y="280" width="200" height="150" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="1382.0" y="339.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload E</text><text x="1382.0" y="360.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">parent table</text><text x="1382.0" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">entries → own array</text><rect x="1482" y="280" width="60" height="150" fill="#fff0cc" stroke="#43576a" stroke-width="1"/><text x="1512.0" y="349.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Block</text><text x="1512.0" y="370.5" text-anchor="middle" font-size="10.16949152542373" font-weight="normal" fill="#43576a">Header F</text><rect x="1542" y="280" width="200" height="150" fill="#deecff" stroke="#43576a" stroke-width="1"/><text x="1642.0" y="339.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Payload F</text><text x="1642.0" y="360.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">child table</text><text x="1642.0" y="381.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#43576a">entries → own array</text><rect x="32" y="280" width="1710" height="150" fill="none" stroke="#43576a" stroke-width="1.5"/><rect x="32" y="430" width="1710" height="30" fill="#f0f3f6" stroke="#43576a" stroke-width="1"/><text x="887.0" y="451" text-anchor="middle" font-size="15" font-weight="bold" fill="#43576a">Kernel Heap · each header is immediately adjacent to its own payload</text><path d="M 167.0 280 C 167.0 130, 884.5 130, 884.5 280" fill="none" stroke="#26715b" stroke-width="2" marker-end="url(#26715b)"/><rect x="470.6" y="152.5" width="158.8" height="22" fill="white" stroke="none" stroke-width="1"/><text x="550" y="168.5" text-anchor="middle" font-size="14" font-weight="normal" fill="#26715b">working_directory</text><path d="M 517.0 280 C 517.0 195, 1129.5 195, 1129.5 280" fill="none" stroke="#26715b" stroke-width="2" marker-end="url(#26715b)"/><rect x="865.6" y="201.25" width="158.8" height="22" fill="white" stroke="none" stroke-width="1"/><text x="945" y="217.25" text-anchor="middle" font-size="14" font-weight="normal" fill="#26715b">working_directory</text><path d="M 884.5 430 C 884.5 500, 1129.5 500, 1129.5 430" fill="none" stroke="#26715b" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#26715b)"/><rect x="902.4" y="467.5" width="209.20000000000002" height="22" fill="white" stroke="none" stroke-width="1"/><text x="1007.0" y="483.5" text-anchor="middle" font-size="14" font-weight="normal" fill="#26715b">copy string during load</text><path d="M 307.0 430 C 307.0 610, 1382.0 610, 1382.0 430" fill="none" stroke="#405ea8" stroke-width="2" marker-end="url(#405ea8)"/><rect x="534.8" y="550.0" width="150.4" height="22" fill="white" stroke="none" stroke-width="1"/><text x="610" y="566.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#405ea8">file_descriptors</text><path d="M 657.0 430 C 657.0 690, 1642.0 690, 1642.0 430" fill="none" stroke="#405ea8" stroke-width="2" marker-end="url(#405ea8)"/><rect x="1104.8" y="610.0" width="150.4" height="22" fill="white" stroke="none" stroke-width="1"/><text x="1180" y="626.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#405ea8">file_descriptors</text><path d="M 1382.0 430 C 1382.0 490, 1642.0 490, 1642.0 430" fill="none" stroke="#785099" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#785099)"/><rect x="1420.0" y="460.0" width="184.0" height="22" fill="white" stroke="none" stroke-width="1"/><text x="1512.0" y="476.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#785099">deep copy during run</text><rect x="442" y="280" width="290" height="150" fill="none" stroke="#9c3d15" stroke-width="3"/><text x="32" y="698" text-anchor="start" font-size="16" font-weight="normal" fill="#43576a">Descriptor entry arrays and their path allocations are omitted. These copy operations never share those objects.</text></g></svg>
