name: Run tests

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

defaults:
  run:
    working-directory: Pico-OS

jobs:
  tests:
    name: PicoOS tests with direct compilation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PicoOS
        uses: actions/checkout@v6
        with:
          path: Pico-OS

      - name: Checkout PicoC-Compiler
        uses: actions/checkout@v6
        with:
          repository: matthejue/PicoC-Compiler
          ref: linker_update
          path: PicoC-Compiler

      - name: Checkout RETI-Emulator
        uses: actions/checkout@v6
        with:
          repository: matthejue/RETI-Emulator
          ref: statemachine
          path: RETI-Emulator

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PicoC-Compiler/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          python -m pip install --upgrade -r ../PicoC-Compiler/requirements.txt

      - name: Build PicoC-Compiler
        run: make -C ../PicoC-Compiler ci-build PYTHON=python

      - name: Build RETI-Emulator
        run: make -C ../RETI-Emulator ci-build LINUX=1 RELEASE=1

      - name: Add toolchain commands to PATH
        run: |
          mkdir -p .ci-bin
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec python "$GITHUB_WORKSPACE/PicoC-Compiler/run.py" "$@"' \
            > .ci-bin/picoc_compiler
          chmod 755 .ci-bin/picoc_compiler
          install -m 755 \
            ../RETI-Emulator/binary/reti_emulator_main \
            .ci-bin/reti_emulator
          echo "$GITHUB_WORKSPACE/Pico-OS/.ci-bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: make test TEST_BUILD_MODE=direct TEST_JOBS="$(nproc)"

      - name: Publish test status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status == 'success' && 'success' || 'failure' }}',
              context: 'PicoOS tests',
              description: '${{ job.status == 'success' && 'Tests passed' || 'Tests failed' }}'
            })
