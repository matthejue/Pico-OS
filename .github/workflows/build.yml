name: Build PicoOS artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Compile and assemble every PicoOS program
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Clone toolchain repositories
        run: |
          git clone --branch linker_update --depth 1 https://github.com/matthejue/PicoC-Compiler.git ../PicoC-Compiler
          git clone --branch statemachine --depth 1 https://github.com/matthejue/RETI-Emulator.git ../RETI-Emulator

      - name: Build PicoC-Compiler
        run: |
          cd ../PicoC-Compiler
          python -m pip install --upgrade -r requirements.txt
          make ci-build PYTHON=python

      - name: Build RETI Emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          make -C ../RETI-Emulator ci-build LINUX=1 RELEASE=1

      - name: Relink toolchain commands
        run: |
          ln -sfn ../PicoC-Compiler/run.py run.py
          ln -sfn ../interrupt_service_routines/isrs.reti config/isrs.reti
          mkdir -p .ci-bin
          ln -s "$(realpath ../PicoC-Compiler/run.py)" .ci-bin/picoc_compiler
          ln -s "$(realpath ../RETI-Emulator/binary/reti_emulator_main)" .ci-bin/reti_emulator
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Build all PicoOS outputs
        run: make release-tree

      - name: Verify complete runtime artifact set
        run: make verify-release-tree

      - name: Upload PicoOS runtime
        uses: actions/upload-artifact@v7
        with:
          name: pico-os-runtime
          path: binary/
          if-no-files-found: error

  pdf:
    name: Generate README PDF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended lmodern \
            fonts-dejavu fonts-cantarell librsvg2-bin poppler-utils
          # Ubuntu's packaged Pandoc predates the PDF template used by this repo.
          curl --fail --location --retry 3 \
            https://github.com/jgm/pandoc/releases/download/3.6/pandoc-3.6-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/pandoc.tar.gz"
          mkdir -p "$RUNNER_TEMP/pandoc"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/pandoc"
          echo "$RUNNER_TEMP/pandoc/bin" >> "$GITHUB_PATH"

      - name: Install Mermaid renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm install --prefix .readme-pdf --no-save --package-lock=false \
            @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.12.0
          # Use the runner's Chrome; disable its sandbox for headless CI rendering.
          printf '%s\n' '{"args":["--no-sandbox"]}' > .readme-pdf/puppeteer.json

      - name: Generate PDF from the tagged README
        env:
          MERMAID_PUPPETEER_CONFIG: .readme-pdf/puppeteer.json
        run: make readme-pdf README_PDF_BROWSER="$(command -v google-chrome)"

      - name: Verify generated PDF
        run: |
          test -s README.pdf
          pdfinfo README.pdf
          pdftotext README.pdf "$RUNNER_TEMP/readme.txt"
          test -s "$RUNNER_TEMP/readme.txt"

      - name: Upload README PDF
        uses: actions/upload-artifact@v7
        with:
          name: pico-os-documentation
          path: README.pdf
          if-no-files-found: error

  release:
    name: Publish GitHub Release for version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pdf]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pico-os-runtime
          path: release-tree

      - uses: actions/download-artifact@v7
        with:
          name: pico-os-documentation
          path: .

      - name: Create release archive
        run: |
          chmod 755 release-tree/download-tools.sh release-tree/start-picoos.sh
          tar -C release-tree -czf pico-os-runtime.tar.gz \
            boot config device kernel system user \
            README.md download-tools.sh download-tools.ps1 \
            start-picoos.sh start-picoos.ps1

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            pico-os-runtime.tar.gz
            README.pdf
